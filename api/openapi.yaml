      type: object
      additionalProperties: false
      required: [url, interval, tolerance]
      description: "Client-side checks for url-test/fallback. If omitted: gstatic generate_204, 300 seconds, 50 ms. Tolerance applies only to url-test."
      properties:
        url: {type: string, maxLength: 4096}
        interval: {type: integer, minimum: 60, maximum: 86400}
        tolerance: {type: integer, minimum: 0, maximum: 65535}
