    ChannelRuleGroup:
      type: object
      additionalProperties: false
      required: [id, name, enabled, type, builtin_nodes, node_ids, default_exit, rules]
      properties:
        id: {type: string, maxLength: 128}
        name: {type: string, maxLength: 128}
        enabled: {type: boolean}
        type: {type: string, enum: [select, url-test, fallback], description: "Fallback is supported only by Mihomo."}
        builtin_nodes:
          type: array
          maxItems: 2
          uniqueItems: true
          description: "Explicit built-in candidates; an empty array selects none. Reject candidates require Mihomo."
          items: {type: string, enum: [direct, reject]}
        health_check: {$ref: "#/components/schemas/ChannelGroupHealthCheck"}
        node_ids: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string}}
        candidate_order:
          type: array
          maxItems: 10002
          uniqueItems: true
          description: "Display and output order. When provided, must contain each node:<id> and builtin:<kind> candidate exactly once. When omitted, node_ids precede builtin_nodes. Manual client defaults retain their existing priority."
          items: {type: string, maxLength: 136}
        default_exit: {$ref: "#/components/schemas/ChannelRouteExit"}
        rules: {type: array, maxItems: 5000, items: {$ref: "#/components/schemas/ChannelRule"}}
