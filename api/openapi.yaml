        id: {type: string}
        name: {type: string}
        format: {type: string, enum: [sing-box, mihomo, loon]}
        public_host: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionChannel:
      type: object
      additionalProperties: false
      required: [id, name, format, public_host, config, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string, enum: [sing-box, mihomo, loon]}
        public_host: {type: string}
        config: {$ref: "#/components/schemas/SubscriptionChannelConfig"}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionChannelConfig:
      type: object
      additionalProperties: false
      properties:
        export_token_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string}, description: "Keys selected for sharing this channel. Does not change key authorization."}
        exclude_tags: {type: array, items: {type: string}, uniqueItems: true}
        exclude_types: {type: array, items: {type: string}, uniqueItems: true}
        policy: {$ref: "#/components/schemas/ChannelPolicy"}
    SubscriptionDraftPreview:
      type: object
      additionalProperties: false
      required: [format, config]
      properties:
        format: {type: string, enum: [sing-box, mihomo, loon]}
        config: {$ref: "#/components/schemas/SubscriptionChannelConfig"}
    ChannelPolicy:
      type: object
      additionalProperties: false
      required: [selection, organizer, groups, default_exit]
      properties:
        selection: {$ref: "#/components/schemas/ChannelNodeSelection"}
        organizer: {$ref: "#/components/schemas/ChannelNodeOrganizer"}
        groups: {type: array, maxItems: 256, items: {$ref: "#/components/schemas/ChannelRuleGroup"}}
        default_exit: {$ref: "#/components/schemas/ChannelRouteExit"}
        template: {$ref: "#/components/schemas/ChannelNativeTemplate"}
    ChannelNodeSelection:
      type: object
      additionalProperties: false
      required: [ids, excluded_ids, new_node_policy]
      properties:
        ids: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string}}
        excluded_ids: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string}}
        new_node_policy: {type: string, enum: [include, exclude]}
    ChannelNodeOrganizer:
      type: object
      additionalProperties: false
      required: [prefix, exclude_names, sort, deduplicate, incompatible]
      properties:
        prefix: {type: string, maxLength: 128}
