openapi: 3.1.0
info:
  title: sing-box-panel API
  version: 0.2.0
  description: >-
    Local management API for one raw sing-box configuration
    history, optional native schemas, immutable startup artifacts, runtime
    operations, live subscription publication, and sanitized observability.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /filesystem/entries:
    get:
      operationId: listFilesystemEntries
      description: >-
        Read-only browsing within the panel process filesystem namespace and OS permissions.
        Relative paths use data_dir/runtime. An existing file opens its parent;
        missing paths ascend to the nearest existing directory with fallback=true.
        Permission errors do not ascend. Symlinks and dot components retain their
        selected spelling and are resolved by the OS, without lexical path cleaning.
        No file content is read. Hidden names are excluded by default. Directories
        precede other entries, then names sort by UTF-8 bytes. A scan is limited
        to 20000 entries; larger directories return filesystem_directory_too_large.
        Invalid UTF-8 names cannot be represented and are omitted. Responses are no-store.
      parameters:
        - name: path
          in: query
          description: Initial file or directory path; defaults to data_dir/runtime.
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: search
          in: query
          description: Case-insensitive filename substring within this directory.
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: show_hidden
          in: query
          schema: {type: boolean, default: false}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Directory metadata and one page; an out-of-range offset is clamped to the last page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilesystemPage'}
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "500":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
  /filesystem/resolve:
    get:
      operationId: resolveFilesystemPath
      description: >-
        Check existence and target type immediately before selecting an absolute path.
        Relative paths use data_dir/runtime. output-file accepts an existing regular
        file or a missing file with an existing directory parent. Broken links are
        rejected. Links are followed for type checks but their paths are preserved.
        Dot components are resolved by the OS without lexical path cleaning.
        Does not create files, read content, check content validity or guarantee
        availability or write permission at core startup. Responses are no-store.
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: mode
          in: query
          required: true
          schema: {$ref: '#/components/schemas/FilesystemMode'}
      responses:
        "200":
          description: Checked absolute path and target metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilesystemSelection'}
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "500":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
  /panel/settings:
    get:
      operationId: getPanelSettings
      responses:
        "200":
          description: Persisted settings with credentials redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelSettingsView"
    put:
      operationId: savePanelSettings
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelSettingsWrite"
      responses:
        "200":
          description: Saved settings. Network changes require a panel restart; credential changes invalidate prior sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelSettingsView"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /panel/backup:
    get:
      operationId: exportPanelBackup
      responses:
        "200":
          description: Plaintext backup of saved settings and sing-box text, including credentials. Never cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PanelBackup'}
        "500":
          $ref: '#/components/responses/Problem'
  /panel/restore:
    post:
      operationId: restorePanelBackup
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PanelRestoreRequest'}
      responses:
        "200":
          description: Both saved configurations restored atomically. Does not apply or restart sing-box.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PanelRestoreResult'}
        "412":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
  /config/file:
    get:
      operationId: getConfigurationFile
      responses:
        "200":
          description: The one editable configuration file, including incomplete JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationFile"
    put:
      operationId: saveConfigurationFile
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationFileWrite"
      responses:
        "200":
          description: Exact saved text. Saving does not validate or change the running process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationFile"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Session"
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          $ref: "#/components/responses/SystemStatus"
  /dashboard/context:
    get:
      operationId: getDashboardContext
      responses:
        "200":
          $ref: "#/components/responses/DashboardContext"
  /config/preview:
    post:
      operationId: previewConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
      responses:
        "200":
          description: Non-persisted raw sing-box JSON for the selected exact binary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPreview"
        "409":
          description: configuration_not_saved; save a configuration before previewing it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /config/compile:
    post:
      operationId: compileConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
      responses:
        "200":
          description: Immutable raw configuration artifact after the exact-core check completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationCompile"
        "409":
          description: configuration_not_saved; save a configuration before checking it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /config/artifacts:
    get:
      operationId: listStartupArtifacts
      parameters:
        - $ref: "#/components/parameters/CanonicalRevisionFilter"
        - $ref: "#/components/parameters/CoreVersionFilter"
        - $ref: "#/components/parameters/CoreArtifactFilter"
        - $ref: "#/components/parameters/StartupStateFilter"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StartupArtifactPage"
  /config/apply:
    post:
      operationId: applyStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeResponse"
  /core/catalog/assets:
    get:
      operationId: listCoreCatalogAssets
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
      responses:
        "200":
          $ref: "#/components/responses/CatalogAssetList"
  /core/catalog/refresh:
    post:
      operationId: refreshCoreCatalog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [force]
              properties:
                force:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/CatalogRefresh"
  /core/artifacts:
    get:
      operationId: listCoreArtifacts
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/CoreSourceKind"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifactPage"
  /core/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifact
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
    delete:
      operationId: deleteCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /core/artifacts/{artifactId}/enable:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: enableCoreArtifact
      description: Validate and select this platform-matching binary using the saved configuration. Panel startup initializes an absent configuration to an empty JSON object. Preserve stopped state; replace a running core only after validation. The enabled version persists independently of process state.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
        "409":
          description: configuration_not_saved or core_enable_blocked; save a configuration and select a compatible core before retrying.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /core/artifacts/{artifactId}/disable:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: disableCoreArtifact
      description: Stop the enabled core and clear its selected version and current symlink after the stop succeeds. Reject requests for a different or no-longer-enabled artifact. Ordinary runtime stop retains the selected version.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/artifacts/{artifactId}/configuration-support:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifactConfigurationSupport
      responses:
        "200":
          description: Structured editor availability for the exact sing-box version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSupport"
  /core/artifacts/{artifactId}/configuration-schema:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifactConfigurationSchema
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Native Draft 2020-12 schema for the artifact's exact sing-box version.
          headers:
            ETag:
              description: Validator bound to the exact version and Schema digest.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSchemaContract"
        "304":
          description: The exact-version Schema has not changed.
          headers:
            ETag:
              description: Validator bound to the exact version and Schema digest.
              schema:
                type: string
  /core/install:
    post:
      operationId: installCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_id]
              properties:
                asset_id:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
  /core/import:
    post:
      operationId: importCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, exact_version, architecture, variant]
              properties:
                archive:
                  type: string
                  format: binary
                exact_version:
                  type: string
                architecture:
                  type: string
                variant:
                  $ref: "#/components/schemas/CoreVariant"
                source_description:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
  /core/status:
    get:
      operationId: getCoreRuntimeStatus
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/runtime/history:
    get:
      operationId: getCoreRuntimeHistory
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RuntimeTransitionStateFilter"
        - $ref: "#/components/parameters/RuntimeTransitionReasonFilter"
        - $ref: "#/components/parameters/ActivationBundleFilter"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/RuntimeTransitionBeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeHistoryPage"
  /core/check:
    post:
      operationId: checkStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/StartupArtifact"
      responses:
        "200":
          $ref: "#/components/responses/StartupArtifactSummary"
  /core/activate:
    post:
      operationId: activateStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeResponse"
  /core/start:
    post:
      operationId: startCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/stop:
    post:
      operationId: stopCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/restart:
    post:
      operationId: restartCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/rollback:
    post:
      operationId: rollbackCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeRollbackRequest"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /subscription/nodes:
    get:
      operationId: listSubscriptionNodes
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionNodeCatalog"
    post:
      operationId: createSubscriptionNode
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outbound]
              properties:
                outbound: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Created manual node
          content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeDetail"}}}
  /subscription/nodes/parse:
    post:
      operationId: parseSubscriptionNode
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, maxLength: 262144}
      responses:
        "200":
          description: One normalized outbound; no data is saved
          content: {application/json: {schema: {type: object, required: [outbound_json], properties: {outbound_json: {type: string}}}}}
  /subscription/nodes/{nodeId}:
    parameters: [{$ref: "#/components/parameters/NodeID"}]
    get:
      operationId: getSubscriptionNode
      responses:
        "200":
          description: Authenticated node detail, including credentials; never cache
          content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeDetail"}}}
    put:
      operationId: updateSubscriptionNode
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outbound, revision]
              properties:
                outbound: {type: object, additionalProperties: true}
                revision: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Updated manual node
          content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeDetail"}}}
    delete:
      operationId: deleteSubscriptionNode
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: integer, format: int64, minimum: 1}
      responses:
        "204": {description: Manual node deleted; core inbounds cannot be deleted here}
  /subscription/nodes/{nodeId}/visibility:
    parameters: [{$ref: "#/components/parameters/NodeID"}]
    put:
      operationId: setSubscriptionNodeVisibility
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hidden, revision]
              properties:
                hidden: {type: boolean}
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: Publication visibility updated; core execution is unchanged
          content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeSummary"}}}
  /subscription/users:
    get:
      operationId: listSubscriptionUsers
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserPage"
    post:
      operationId: createSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionUser"
  /subscription/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUser
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUser"
    put:
      operationId: updateSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUser"
    delete:
      operationId: deleteSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/users/{userId}/grants:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUserGrants
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserGrants"
    put:
      operationId: replaceSubscriptionUserGrants
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserGrants"
  /subscription/channels:
    get:
      operationId: listSubscriptionChannels
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannelPage"
    post:
      operationId: createSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionChannel"
  /subscription/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: getSubscriptionChannel
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannel"
    put:
      operationId: updateSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannel"
    delete:
      operationId: deleteSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/channels/{channelId}/preview:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    post:
      operationId: previewSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                draft:
                  $ref: "#/components/schemas/SubscriptionDraftPreview"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionPreview"
  /subscription/sources:
    get:
      operationId: listSubscriptionSources
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourcePage"
    post:
      operationId: createSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionSource"
  /subscription/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: getSubscriptionSource
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
    put:
      operationId: updateSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
    delete:
      operationId: deleteSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/sources/{sourceId}/refresh:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    post:
      operationId: refreshSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourceRefreshResult"
  /subscription/sources/{sourceId}/versions:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: listSubscriptionSourceVersions
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourceVersionPage"
    post:
      operationId: createSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format, raw_body]
              properties:
                format:
                  type: string
                  enum: [auto, sing-box-json, mihomo-yaml, uri-list]
                raw_body:
                  type: string
                  format: byte
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionSourceVersionSave"
  /subscription/sources/{sourceId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    get:
      operationId: getSubscriptionSourceVersion
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourceVersion"
  /subscription/sources/{sourceId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    post:
      operationId: restoreSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
  /subscription/tokens:
    get:
      operationId: listSubscriptionTokens
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionTokenPage"
    post:
      operationId: createSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTokenCreate"
      responses:
        "201":
          $ref: "#/components/responses/CreatedSubscriptionToken"
  /subscription/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    get:
      operationId: getSubscriptionToken
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
    delete:
      operationId: deleteSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/tokens/{tokenId}/secret:
    parameters:
      - $ref: '#/components/parameters/TokenID'
    get:
      operationId: getSubscriptionTokenSecret
      summary: Reveal a stored subscription key for authenticated administration
      responses:
        '200':
          description: Secret key. Response is never cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionTokenSecret'}
        default: {$ref: '#/components/responses/Problem'}
  /subscription/tokens/{tokenId}/rotate:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: rotateSubscriptionToken
      description: >-
        Replaces an unrevoked key regardless of its enabled or active state.
        Atomically revokes the old key and preserves enablement, access scope,
        download quota and usage. Expiry is retained unless expires_at is supplied.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_at:
                  type: [string, "null"]
                  format: date-time
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionTokenRotation"
  /subscription/tokens/{tokenId}/revoke:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: revokeSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /subscription/tokens/{tokenId}/enable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: enableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /subscription/tokens/{tokenId}/disable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: disableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /sub/{token}/{channelId}:
    servers:
      - url: /
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: downloadSubscription
      security: []
      responses:
        "200":
          description: Rendered subscription for the key's channel scope and policy, retaining live grants for legacy user-scoped keys.
        "304":
          description: The current live publication matches If-None-Match.
  /core/logs/files:
    delete:
      operationId: deleteCoreLogFile
      summary: Delete one managed core output file outside the current UTC day
      description: Deletes only the panel's captured copy, never the native log.output file. All segments from the current UTC day are protected. Cookie sessions require CSRF protection.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: file
          in: query
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}-\d{3,20}\.log$'}
      responses:
        '204':
          description: The selected managed file was deleted.
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: The selected file belongs to the current UTC day (core_log_current).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listCoreLogFiles
      summary: List bounded captured core output files
      responses:
        '200':
          description: Most recent files first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CoreLogFile'}}
        default: {$ref: '#/components/responses/Problem'}
  /core/logs/content:
    delete:
      operationId: clearCoreLog
      summary: Clear the persisted contents of one managed core output file
      description: Truncates only the selected captured file, including an active file from today. The file remains available and new output continues to append. Other segments, dates, database events and the native log.output file are unchanged. Filters do not restrict clearing. Discard pending reads and streams before clearing; after success discard displayed contents and restart at offset 0. Byte offsets from before clearing are invalid. Cookie sessions require CSRF protection.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: file
          in: query
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}-\d{3,20}\.log$'}
      responses:
        '204':
          description: Existing captured contents were cleared. New output may already have been appended.
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: readCoreLog
      parameters:
        - name: file
          in: query
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}-\d{3,20}\.log$'}
        - name: offset
          in: query
          schema: {type: integer, format: int64, minimum: -1, default: -1}
        - name: generation
          in: query
          description: Generation returned with the previous chunk. If stale, the read restarts at zero and returns reset=true.
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Sanitized native process output. Offset -1 starts at the last 64 KiB; reconnect using next_offset and generation. Clearing a file or restarting the server changes its generation; discard the previous display when reset is true. Offset-only clients remain supported but must discard their own pre-clear cursors.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreLogChunk'}
        default: {$ref: '#/components/responses/Problem'}
  /core/logs/stream:
    get:
      operationId: streamCoreLog
      parameters:
        - name: file
          in: query
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}-\d{3,20}\.log$'}
        - name: offset
          in: query
          schema: {type: integer, format: int64, minimum: -1, default: -1}
        - name: generation
          in: query
          description: Generation returned with the previous chunk. If stale, the read restarts at zero and returns reset=true.
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Sanitized native process output. Offset -1 starts at the last 64 KiB; reconnect using next_offset and generation. Clearing a file or restarting the server changes its generation; discard the previous display when reset is true. Offset-only clients remain supported but must discard their own pre-clear cursors.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /logs/panel:
    get:
      operationId: listPanelLogs
      summary: Panel events and runtime transitions, newest first
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - name: before_time
          in: query
          schema: {type: string, format: date-time}
        - name: before_id
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string, maxLength: 256}
          description: Case-insensitive substring of the original message or event code. Combined with search_codes using OR.
        - name: search_codes
          in: query
          description: Exact event codes matching translated event names. ORed with search, then intersected with other filters before counting and pagination. The complete encoded query is limited to 64 KiB, allowing the full code range even with percent encoding.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 128
            items: {type: string, maxLength: 128, pattern: '^[a-z][a-z0-9_.-]*$'}
      responses:
        '200':
          description: Panel activity and runtime transition history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PanelLogPage'}
        default: {$ref: '#/components/responses/Problem'}
  /logs:
    get:
      operationId: listLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LogPage"
    delete:
      operationId: clearLogs
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          $ref: "#/components/responses/LogClearResult"
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: Sanitized durable log stream.
          content:
            text/event-stream:
              schema:
                type: string
  /logs/{logId}:
    parameters:
      - $ref: "#/components/parameters/LogID"
    get:
      operationId: getLog
      responses:
        "200":
          $ref: "#/components/responses/LogEntry"
    delete:
      operationId: deleteLog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/LogDeleteResult"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          $ref: "#/components/responses/MetricsSnapshot"
  /metrics/stream:
    get:
      operationId: streamMetrics
      summary: Stream current metrics and runtime evidence every two seconds
      responses:
        '200':
          description: Server-sent metrics events, each containing metrics and runtime objects. Initial snapshot failures return a Problem response before opening the stream. Reconnect after stream closure; the one-minute lifetime includes snapshot collection.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /dashboard/stream:
    get:
      operationId: streamDashboard
      summary: Stream the cached dashboard projection every thirty seconds
      responses:
        '200':
          description: Server-sent dashboard events, each limited to 1 MiB including UTF-8 framing. Each data field is a DashboardStreamSnapshot. Runtime history includes at most 4096 newest transitions, or fewer to fit the byte limit, with a next cursor whenever older records are omitted. Initial snapshot failures return a Problem response. Reconnect after stream closure; the one-minute lifetime includes snapshot collection.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /metrics/history:
    get:
      operationId: getMetricsHistory
      description: Returns at most 512 buckets across a range no longer than 90 days; missing evidence remains null.
      parameters:
        - $ref: "#/components/parameters/MetricsHistoryFrom"
        - $ref: "#/components/parameters/MetricsHistoryTo"
        - $ref: "#/components/parameters/MetricsHistoryBucketSeconds"
        - $ref: "#/components/parameters/ActivationBundleFilter"
      responses:
        "200":
          $ref: "#/components/responses/MetricsHistory"
  /traffic/status:
    get:
      operationId: getTrafficStatus
      responses:
        "200":
          $ref: "#/components/responses/MetricsSnapshot"
  /traffic/periods:
    get:
      operationId: listTrafficPeriods
      parameters:
        - $ref: "#/components/parameters/ActivationBundleFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TrafficPeriodPage"
  /traffic/periods/{periodId}:
    parameters:
      - $ref: "#/components/parameters/TrafficPeriodID"
    get:
      operationId: getTrafficPeriod
      responses:
        "200":
          $ref: "#/components/responses/TrafficPeriod"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbp_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated writes; bearer writes do not require it.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BeforeTime:
      name: before_time
      in: query
      description: Must be supplied together with before_id.
      schema:
        type: string
        format: date-time
    BeforeID:
      name: before_id
      in: query
      description: Must be supplied together with before_time.
      schema:
        type: string
    RuntimeTransitionBeforeID:
      name: before_id
      in: query
      description: Numeric runtime-transition ID; must be supplied together with before_time.
      schema:
        type: integer
        format: int64
        minimum: 1
    ExactVersion:
      name: exact_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Architecture:
      name: architecture
      in: query
      schema:
        type: string
        enum: [amd64, arm64]
    Variant:
      name: variant
      in: query
      schema:
        $ref: "#/components/schemas/CoreVariant"
    CoreSourceKind:
      name: source_kind
      in: query
      schema:
        type: string
        enum: [official, user_verified]
    CanonicalRevisionFilter:
      name: canonical_revision_id
      in: query
      schema:
        type: string
    CoreVersionFilter:
      name: core_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    CoreArtifactFilter:
      name: core_artifact_id
      in: query
      schema:
        type: string
    StartupStateFilter:
      name: state
      in: query
      schema:
        type: string
        enum: [pending, ready, failed]
    LogSource:
      name: source
      in: query
      schema:
        type: string
        enum: [panel, core, security]
    PageOffset:
      name: offset
      in: query
      description: Zero-based row offset for numbered pages. Cannot be combined with before_time or before_id. Existing cursor pagination remains supported.
      schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
    LogLevel:
      name: level
      in: query
      schema:
        type: string
        enum: [trace, debug, info, warn, error, fatal]
    LogCode:
      name: code
      in: query
      schema:
        type: string
    Since:
      name: since
      in: query
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      schema:
        type: string
        format: date-time
    AfterTime:
      name: after_time
      in: query
      description: Must be supplied together with after_id.
      schema:
        type: string
        format: date-time
    AfterID:
      name: after_id
      in: query
      description: Must be supplied together with after_time.
      schema:
        type: string
    LastEventID:
      name: Last-Event-ID
      in: header
      schema:
        type: string
    ActivationBundleFilter:
      name: activation_bundle_id
      in: query
      schema:
        type: string
    RuntimeTransitionStateFilter:
      name: state
      in: query
      schema:
        type: string
        enum: [running, stopped, failed, unknown]
    RuntimeTransitionReasonFilter:
      name: reason
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z][a-z0-9_.-]*$'
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    MetricsHistoryFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    MetricsHistoryTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    MetricsHistoryBucketSeconds:
      name: bucket_seconds
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ArtifactID:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
    NodeID:
      name: nodeId
      in: path
      required: true
      schema: {type: string}
    ChannelID:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    SourceVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    TokenID:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    LogID:
      name: logId
      in: path
      required: true
      schema:
        type: string
    TrafficPeriodID:
      name: periodId
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    StartupArtifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id]
            properties:
              startup_artifact_id:
                type: string
    Activation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id, monitoring_tier]
            properties:
              startup_artifact_id:
                type: string
              monitoring_tier:
                type: string
                enum: [process_only, limited]
    SubscriptionUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionUserInput"
    SubscriptionChannel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionChannelInput"
    SubscriptionSource:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionSourceInput"
  responses:
    SubscriptionSourceRefreshResult:
      description: Refreshed subscription source.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceRefreshResult"}}}
    StartupArtifactSummary:
      description: Validated startup artifact.
      content: {application/json: {schema: {$ref: "#/components/schemas/StartupArtifactSummary"}}}
    CatalogRefresh:
      description: Completed catalog refresh.
      content: {application/json: {schema: {$ref: "#/components/schemas/CatalogRefresh"}}}
    Health:
      $ref: "#/components/responses/HealthResponse"
    HealthResponse:
      description: Panel process health and build version.
      content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}
    Session:
      description: Current management session.
      content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
    SystemStatus:
      description: Current control-plane status.
      content: {application/json: {schema: {$ref: "#/components/schemas/SystemStatus"}}}
    DashboardContext:
      description: Dashboard projection of durable and observed state.
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardContext"}}}
    StartupArtifactPage:
      description: Page of immutable startup artifacts.
      content: {application/json: {schema: {$ref: "#/components/schemas/StartupArtifactPage"}}}
    RuntimeResponse:
      description: Completed runtime operation and observed process state.
      content: {application/json: {schema: {$ref: "#/components/schemas/RuntimeResponse"}}}
    CatalogAssetList:
      description: Filtered catalog assets.
      content: {application/json: {schema: {$ref: "#/components/schemas/CatalogAssetList"}}}
    CoreArtifactPage:
      description: Page of immutable core artifacts.
      content: {application/json: {schema: {$ref: "#/components/schemas/CoreArtifactPage"}}}
    CoreArtifact:
      description: Immutable core artifact metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/CoreArtifact"}}}
    RuntimeStatus:
      description: Durable runtime intent and observed process identity.
      content: {application/json: {schema: {$ref: "#/components/schemas/RuntimeStatus"}}}
    RuntimeHistoryPage:
      description: Stable newest-first page of durable runtime transitions.
      content: {application/json: {schema: {$ref: "#/components/schemas/RuntimeHistoryPage"}}}
    SubscriptionNodeCatalog:
      description: Current publishable subscription node catalog.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeCatalog"}}}
    SubscriptionUserPage:
      description: Page of subscription users.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUserPage"}}}
    SubscriptionUser:
      description: Subscription user.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUser"}}}
    SubscriptionUserGrants:
      description: Subscription user and live node grants.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUserGrants"}}}
    SubscriptionChannelPage:
      description: Page of subscription channels.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionChannelPage"}}}
    SubscriptionChannel:
      description: Subscription channel.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionChannel"}}}
    SubscriptionPreview:
      description: Rendered subscription preview and provenance.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPreview"}}}
    SubscriptionSourcePage:
      description: Page of subscription sources.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourcePage"}}}
    SubscriptionSource:
      description: Subscription source.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSource"}}}
    SubscriptionSourceVersionPage:
      description: Page of immutable subscription source versions.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersionPage"}}}
    SubscriptionSourceVersionSave:
      description: Saved source version and advanced source pointer.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersionSave"}}}
    SubscriptionSourceVersion:
      description: Immutable subscription source version.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersion"}}}
    SubscriptionTokenPage:
      description: Page of subscription token metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTokenPage"}}}
    CreatedSubscriptionToken:
      description: Token metadata and plaintext token.
      content: {application/json: {schema: {$ref: "#/components/schemas/CreatedSubscriptionToken"}}}
    SubscriptionToken:
      description: Subscription token metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionToken"}}}
    SubscriptionTokenRotation:
      description: Revoked token, replacement metadata, and plaintext token.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTokenRotation"}}}
    LogPage:
      description: Page of sanitized durable logs.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogPage"}}}
    LogClearResult:
      description: Count of deleted log entries.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogClearResult"}}}
    LogEntry:
      description: Sanitized durable log entry.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogEntry"}}}
    LogDeleteResult:
      description: Deleted log identity.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogDeleteResult"}}}
    MetricsSnapshot:
      description: Collector-backed metrics availability and latest evidence.
      content: {application/json: {schema: {$ref: "#/components/schemas/MetricsSnapshot"}}}
    MetricsHistory:
      description: Bounded, gap-preserving historical metric buckets.
      content: {application/json: {schema: {$ref: "#/components/schemas/MetricsHistory"}}}
    TrafficPeriodPage:
      description: Traffic periods.
      content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPeriodPage"}}}
    TrafficPeriod:
      description: One persisted traffic period.
      content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPeriod"}}}
    NoContent:
      description: Operation completed without a response body.
    Problem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    FilesystemMode:
      type: string
      enum: [file, directory, output-file, socket]
    FilesystemEntry:
      type: object
      additionalProperties: false
      required: [name, path, kind, symlink, available]
      properties:
        name: {type: string}
        path: {type: string}
        kind: {type: string, enum: [file, directory, socket, other]}
        symlink: {type: boolean}
        available:
          type: boolean
          description: Target metadata was accessible; false includes broken links and entries removed during listing.
    FilesystemPage:
      type: object
      additionalProperties: false
      required: [path, parent, requested_path, fallback, items, total, offset, limit]
      properties:
        path: {type: string}
        parent: {type: string}
        requested_path: {type: string}
        fallback: {type: boolean}
        items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/FilesystemEntry'}
        total: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
    FilesystemSelection:
      type: object
      additionalProperties: false
      required: [path, parent, kind, exists, symlink]
      properties:
        path: {type: string}
        parent: {type: string}
        kind: {type: string, enum: [file, directory, socket]}
        exists: {type: boolean}
        symlink: {type: boolean}
    CatalogRefresh:
      type: object
      additionalProperties: false
      required: [refreshed_at, not_modified, releases, assets]
      properties:
        refreshed_at: {type: string, format: date-time}
        not_modified: {type: boolean}
        releases: {type: integer, minimum: 0}
        assets: {type: integer, minimum: 0}
    SubscriptionSourceRefreshResult:
      type: object
      additionalProperties: false
      required: [source_id, version_id, format, sha256, node_count, fetched_at]
      properties:
        source_id: {type: string}
        version_id: {type: string}
        format: {type: string}
        sha256: {type: string}
        node_count: {type: integer, minimum: 0}
        fetched_at: {type: string, format: date-time}
    AppearanceSettings:
      type: object
      additionalProperties: false
      required: [theme, color, radius]
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        radius:
          type: integer
          minimum: 0
          maximum: 32
    PanelPreferences:
      type: object
      additionalProperties: false
      required: [listen_host, listen_port, external_origin, public_node_host, traffic_quota_gib, language, appearance]
      properties:
        listen_host:
          type: string
          maxLength: 64
        listen_port:
          type: integer
          minimum: 1
          maximum: 65535
        external_origin:
          type: string
          maxLength: 2048
        public_node_host:
          type: string
          maxLength: 253
        traffic_quota_gib:
          type: [integer, 'null']
          minimum: 0
          maximum: 8589934591
        language:
          type: string
          enum: [zh-CN, en]
        appearance:
          $ref: '#/components/schemas/AppearanceSettings'
    ConfigurationFile:
      type: object
      description: The saved sing-box document. Panel startup initializes an absent document to {} at revision 1 and preserves existing saved text.
      additionalProperties: false
      required: [revision, content, syntax_valid]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        content:
          type: string
          maxLength: 2097152
        canonical_revision_id:
          type: string
        syntax_valid:
          type: boolean
          description: Strict JSON object syntax only; does not imply sing-box check succeeded.
        updated_at:
          type: string
          format: date-time
    ConfigurationFileWrite:
      type: object
      additionalProperties: false
      required: [revision, content]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        content:
          type: string
          maxLength: 2097152
    PanelBackup:
      type: object
      additionalProperties: false
      required: [format, version, exported_at, panel_settings, sing_box_configuration]
      properties:
        format: {type: string, enum: [sing-box-panel-backup]}
        version: {type: integer, enum: [1]}
        exported_at: {type: string, format: date-time}
        panel_settings:
          type: object
          additionalProperties: true
          description: Complete native setting.json, including credentials. Validated using the settings-file contract; at most 1 MiB.
        sing_box_configuration:
          type: string
          description: Exact saved UTF-8 text, including incomplete JSON; at most 2 MiB in UTF-8.
          maxLength: 2097152
    PanelRestoreRequest:
      type: object
      additionalProperties: false
      required: [backup, settings_revision, configuration_revision]
      properties:
        backup: {$ref: '#/components/schemas/PanelBackup'}
        settings_revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        configuration_revision: {type: integer, format: int64, minimum: 0}
    PanelRestoreResult:
      type: object
      additionalProperties: false
      required: [settings, reauthentication_required]
      properties:
        settings: {$ref: '#/components/schemas/PanelSettingsView'}
        reauthentication_required: {type: boolean}
    PanelServiceSettings:
      type: object
      additionalProperties: false
      required: [data_dir, base_path, secure_cookie, catalog_refresh_interval_hours, traffic_period_months, sample_retention_days, private_source_cidrs]
      properties:
        data_dir:
          type: string
          description: Absolute data directory. Takes effect after restarting the service.
        base_path:
          type: string
        secure_cookie:
          type: boolean
        catalog_refresh_interval_hours:
          type: integer
          minimum: 1
          maximum: 720
        traffic_period_months:
          type: integer
          minimum: 1
          maximum: 120
        sample_retention_days:
          type: integer
          minimum: 1
          maximum: 366
        private_source_cidrs:
          type: array
          items: {type: string}
        core_log_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 7
          description: UTC dates retained, including today. Omitted writes preserve the saved policy.
        core_log_max_files:
          type: integer
          minimum: 0
          maximum: 1024
          default: 0
          description: Zero is unlimited. A positive cap can shorten date-based retention.
        core_log_max_file_size_mib:
          type: integer
          minimum: 1
          maximum: 1024
          default: 32
    PanelSettingsView:
      type: object
      additionalProperties: false
      required: [revision, preferences, service, github_token_configured, restart_required]
      properties:
        detected_public_ip:
          type: string
          description: Cached best-effort public address hint; never an operator override.
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Opaque fingerprint of the shared settings file, including manual edits; not a sequence number.
        preferences:
          $ref: '#/components/schemas/PanelPreferences'
        service:
          $ref: '#/components/schemas/PanelServiceSettings'
        github_token_configured:
          type: boolean
        restart_required:
          type: boolean
    PanelSettingsWrite:
      type: object
      additionalProperties: false
      required: [revision, preferences]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Opaque fingerprint of the shared settings file, including manual edits; not a sequence number.
        preferences:
          $ref: '#/components/schemas/PanelPreferences'
        service:
          $ref: '#/components/schemas/PanelServiceSettings'
        github_token:
          type: string
          maxLength: 8192
          description: Write-only. Empty or omitted retains the existing credential.
        clear_github_token:
          type: boolean
          description: Explicitly removes the persisted GitHub credential.
        management_token:
          type: string
          maxLength: 8192
          description: Write-only. Empty or omitted retains the current token. A nonempty replacement must be 8–8192 UTF-8 bytes, without leading or trailing Unicode whitespace or BOM, NUL, CR, or LF. A valid replacement invalidates existing sessions; rejected writes retain the current token and sessions.
    DynamicObject:
      type: object
      additionalProperties: true
    DynamicValue: {}
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string}
        csrfToken: {type: string}
        expiresAt: {type: string, format: date-time}
    SystemStatus:
      type: object
      additionalProperties: false
      required: [panel_version, canonical_revision, applied_bundle_id, running, running_version, running_artifact, configuration_state]
      properties:
        platform:
          type: object
          additionalProperties: false
          required: [os, arch]
          properties:
            os: {type: string}
            arch: {type: string}
        panel_version: {type: string}
        canonical_revision: {type: integer, format: int64}
        applied_bundle_id: {type: [string, "null"]}
        running: {type: boolean}
        running_version: {type: [string, "null"]}
        running_artifact: {type: [string, "null"]}
        configuration_state: {type: string}
    DashboardContext:
      type: object
      additionalProperties: false
      required: [view, running, canonical, applied, configuration]
      properties:
        view:
          type: object
          additionalProperties: false
          required: [exactVersion]
          properties: {exactVersion: {type: string}}
        running:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DashboardRuntime"
        canonical:
          type: object
          additionalProperties: false
          required: [revision, savedAt, hasUnappliedChanges]
          properties:
            revision: {type: integer, format: int64}
            savedAt: {type: string, format: date-time}
            hasUnappliedChanges: {type: boolean}
        applied:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DashboardApplied"
        configuration:
          type: object
          additionalProperties: false
          required: [supported, label, warning]
          properties:
            supported: {type: boolean}
            label: {type: string}
            warning: {type: [string, "null"]}
    DashboardRuntime:
      type: object
      additionalProperties: false
      required: [exactVersion, artifactName, digest]
      properties:
        exactVersion: {type: string}
        artifactName: {type: string}
        digest: {type: string}
    DashboardApplied:
      type: object
      additionalProperties: false
      required: [bundle, revision, appliedAt]
      properties:
        bundle: {type: string}
        revision: {type: integer, format: int64}
        appliedAt: {type: string, format: date-time}
    CreatedAtCursor:
      type: object
      additionalProperties: false
      required: [created_at, id]
      properties:
        created_at: {type: string, format: date-time}
        id: {type: string}
    RuntimeIdentity:
      type: object
      additionalProperties: false
      required: [pid, process_start_token, exact_core_version, core_artifact_id, archive_sha256, binary_sha256, activation_bundle_id, started_at]
      properties:
        pid: {type: integer, minimum: 1}
        process_start_token: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        core_artifact_id: {type: string}
        archive_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_sha256: {$ref: "#/components/schemas/SHA256"}
        activation_bundle_id: {type: string}
        started_at: {type: string, format: date-time}
    EnabledCore:
      type: object
      additionalProperties: false
      required: [core_artifact_id, exact_core_version]
      properties:
        core_artifact_id: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [desired_running, target_generation, observation_state]
      properties:
        enabled_core:
          $ref: "#/components/schemas/EnabledCore"
          description: Last successfully selected binary, retained while stopped; omitted before the first successful selection.
        desired_running: {type: boolean}
        desired_bundle_id: {type: string}
        applied_bundle_id: {type: string}
        rollback_bundle_id: {type: string}
        target_generation: {type: integer, format: int64, minimum: 0}
        observation_state: {type: string, enum: [stopped, running, stale, inspection_unavailable]}
        loaded_canonical_revision_id:
          type: string
          description: The immutable configuration proven to belong to the observed live process; omitted for stopped or uncertain state.
        running: {$ref: "#/components/schemas/RuntimeIdentity"}
    RuntimeRollbackRequest:
      type: object
      additionalProperties: false
      required: [activation_bundle_id]
      properties:
        activation_bundle_id: {type: string, minLength: 1}
    RuntimeTransition:
      type: object
      additionalProperties: false
      required: [id, state, reason, occurred_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [running, stopped, failed, unknown]}
        reason: {type: string}
        activation_bundle_id: {type: string}
        generation: {type: integer, format: int64, minimum: 0}
        pid: {type: integer, minimum: 1}
        process_started_at: {type: string, format: date-time}
        occurred_at: {type: string, format: date-time}
        uncertain_since: {type: string, format: date-time}
    RuntimeTransitionCursor:
      type: object
      additionalProperties: false
      required: [occurred_at, id]
      properties:
        occurred_at: {type: string, format: date-time}
        id: {type: integer, format: int64, minimum: 1}
    RuntimeHistoryPage:
      type: object
      additionalProperties: false
      required: [items, history_started_at]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RuntimeTransition"}
        next: {$ref: "#/components/schemas/RuntimeTransitionCursor"}
        preceding: {$ref: "#/components/schemas/RuntimeTransition"}
        history_started_at: {type: string, format: date-time}
    ExactCoreVersion:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    CoreVariant:
      type: string
      const: musl
    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    CoreArtifact:
      type: object
      additionalProperties: false
      required: [id, exact_version, os, arch, variant, source_kind, archive_sha256, binary_sha256, binary_path, reported_version, feature_fingerprint, created_at]
      properties:
        id: {type: string}
        exact_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        os: {type: string, const: linux}
        arch: {type: string, enum: [amd64, arm64]}
        variant: {$ref: "#/components/schemas/CoreVariant"}
        source_kind: {type: string, enum: [official, user_verified]}
        user_source: {type: string}
        repository_id: {type: integer, format: int64, minimum: 1}
        release_id: {type: integer, format: int64, minimum: 1}
        asset_id: {type: integer, format: int64, minimum: 1}
        archive_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_path: {type: string}
        reported_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        feature_fingerprint: {$ref: "#/components/schemas/DynamicObject"}
        created_at: {type: string, format: date-time}
    CoreArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CoreArtifact"}}
        next: {$ref: "#/components/schemas/CreatedAtCursor"}
    CatalogAsset:
      description: Official Linux musl archive; one asset per exact version and CPU architecture.
      type: object
      additionalProperties: false
      required: [repository_id, release_id, asset_id, name, download_url, size, version, os, arch, variant, has_api_digest, has_catalog_digest]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        release_id: {type: integer, format: int64, minimum: 1}
        asset_id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        download_url: {type: string, format: uri}
        size: {type: integer, format: int64, minimum: 0}
        version: {$ref: "#/components/schemas/ExactCoreVersion"}
        os: {type: string, const: linux}
        arch: {type: string, enum: [amd64, arm64]}
        variant: {$ref: "#/components/schemas/CoreVariant"}
        api_digest: {$ref: "#/components/schemas/SHA256"}
        catalog_digest: {$ref: "#/components/schemas/SHA256"}
        has_api_digest: {type: boolean}
        has_catalog_digest: {type: boolean}
    CatalogAssetList:
      type: object
      additionalProperties: false
      required: [validator, refreshed_at, assets]
      properties:
        validator: {type: string}
        refreshed_at: {type: string, format: date-time}
        assets: {type: array, items: {$ref: "#/components/schemas/CatalogAsset"}}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    CanonicalDocument:
      type: object
      description: Raw sing-box configuration JSON. Field semantics are gated by the selected exact binary's check command.
      additionalProperties: true
    CanonicalSnapshot:
      type: object
      required: [id, sequence, schema_version, document, document_json, sha256, created_at]
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
        parent_id:
          type: string
        schema_version:
          type: integer
          const: 1
        document:
          $ref: "#/components/schemas/CanonicalDocument"
        document_json:
          type: string
          description: Lossless JSON representation for clients that preserve large integers.
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
    ConfigurationSupport:
      type: object
      additionalProperties: false
      required: [structured, exact_version]
      properties:
        structured:
          type: boolean
        exact_version:
          type: string
        reason:
          type: string
    ConfigurationSchemaContract:
      type: object
      additionalProperties: false
      required: [exact_version, schema_sha256, schema]
      properties:
        exact_version:
          $ref: "#/components/schemas/ExactCoreVersion"
        schema_sha256:
          $ref: "#/components/schemas/SHA256"
        schema:
          type: object
          additionalProperties: true
    ConfigurationPreview:
      type: object
      required: [canonical_revision, core_artifact, support, config]
      properties:
        canonical_revision:
          $ref: "#/components/schemas/CanonicalSnapshot"
        core_artifact:
          $ref: "#/components/schemas/CoreArtifact"
        support:
          $ref: "#/components/schemas/ConfigurationSupport"
        config:
          $ref: "#/components/schemas/DynamicObject"
    ConfigurationCompile:
      type: object
      required: [support, artifact]
      properties:
        support:
          $ref: "#/components/schemas/ConfigurationSupport"
        artifact:
          $ref: "#/components/schemas/CompiledConfigurationArtifact"
    CompiledConfigurationArtifact:
      type: object
      additionalProperties: false
      required: [id, canonical_revision_id, exact_core_version, core_artifact_id, config_sha256, state]
      properties:
        id: {type: string}
        canonical_revision_id: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        core_artifact_id: {type: string}
        config_sha256: {$ref: "#/components/schemas/SHA256"}
        state: {type: string, enum: [pending, ready, failed]}
    StartupArtifactSummary:
      type: object
      additionalProperties: false
      required: [id, canonical_revision_id, exact_core_version, core_artifact_id, config_sha256, state, created_at]
      properties:
        id: {type: string}
        canonical_revision_id: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        core_artifact_id: {type: string}
        config_sha256: {$ref: "#/components/schemas/SHA256"}
        state: {type: string, enum: [pending, ready, failed]}
        checked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    StartupArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/StartupArtifactSummary"}}
        next: {$ref: "#/components/schemas/CreatedAtCursor"}
    ActivationSummary:
      type: object
      additionalProperties: false
      required: [startup_artifact_id, canonical_revision_id, exact_core_version, core_artifact_id, config_sha256, activation_bundle_id, activation_sha256, monitoring_tier]
      properties:
        startup_artifact_id: {type: string}
        canonical_revision_id: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        core_artifact_id: {type: string}
