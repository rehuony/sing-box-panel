openapi: 3.1.0
info:
  title: sing-box-panel API
  version: 0.2.0
  description: >-
    Local management API for one version-independent sing-box configuration
    history, exact compiled adapters, immutable startup artifacts, runtime
    operations, live subscription publication, and sanitized observability.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Session"
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          $ref: "#/components/responses/SystemStatus"
  /dashboard/context:
    get:
      operationId: getDashboardContext
      responses:
        "200":
          $ref: "#/components/responses/DashboardContext"
  /config/canonical:
    get:
      operationId: getCanonicalConfiguration
      responses:
        "200":
          description: Current global immutable revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSnapshot"
    put:
      operationId: replaceCanonicalConfiguration
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalDocument"
      responses:
        "200":
          description: Saved global revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSave"
    patch:
      operationId: patchCanonicalConfiguration
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items:
                    $ref: "#/components/schemas/CanonicalChange"
      responses:
        "200":
          $ref: "#/components/responses/CanonicalSave"
  /config/preview:
    post:
      operationId: previewConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
                canonical_revision_id:
                  type: string
      responses:
        "200":
          description: Non-persisted projection through the exact adapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPreview"
  /config/compile:
    post:
      operationId: compileConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
                accepted_ignored_digest:
                  type: string
      responses:
        "202":
          description: Immutable compiled candidate and queued exact-core check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationCompile"
  /config/artifacts:
    get:
      operationId: listStartupArtifacts
      parameters:
        - $ref: "#/components/parameters/CanonicalRevisionFilter"
        - $ref: "#/components/parameters/CoreVersionFilter"
        - $ref: "#/components/parameters/CoreArtifactFilter"
        - $ref: "#/components/parameters/StartupStateFilter"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StartupArtifactPage"
  /config/apply:
    post:
      operationId: applyStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "202":
          $ref: "#/components/responses/ActivationQueued"
  /config/revisions:
    get:
      operationId: listCanonicalRevisions
      parameters:
        - $ref: "#/components/parameters/BeforeSequence"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CanonicalRevisionPage"
  /config/revisions/diff:
    get:
      operationId: diffCanonicalRevisions
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/CanonicalRevisionDiff"
  /config/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/RevisionID"
    get:
      operationId: getCanonicalRevision
      responses:
        "200":
          $ref: "#/components/responses/CanonicalSnapshot"
  /config/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/RevisionID"
    post:
      operationId: restoreCanonicalRevision
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/CanonicalSave"
  /core/catalog/assets:
    get:
      operationId: listCoreCatalogAssets
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/Installable"
      responses:
        "200":
          $ref: "#/components/responses/CatalogAssetList"
  /core/catalog/refresh:
    post:
      operationId: refreshCoreCatalog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [force]
              properties:
                force:
                  type: boolean
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/artifacts:
    get:
      operationId: listCoreArtifacts
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/CoreSourceKind"
        - $ref: "#/components/parameters/VerificationState"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifactPage"
  /core/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifact
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
    delete:
      operationId: deleteCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /core/artifacts/{artifactId}/configuration-support:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifactConfigurationSupport
      responses:
        "200":
          description: Exact compiled adapter support for the complete binary profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationAdapterSupport"
  /core/artifacts/{artifactId}/quarantine:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: quarantineCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
  /core/artifacts/{artifactId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: revokeCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/CoreArtifact"
  /core/install:
    post:
      operationId: installCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_id]
              properties:
                asset_id:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/import:
    post:
      operationId: importCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, sha256, exact_version, architecture, variant]
              properties:
                archive:
                  type: string
                  format: binary
                sha256:
                  type: string
                exact_version:
                  type: string
                architecture:
                  type: string
                variant:
                  $ref: "#/components/schemas/CoreVariant"
                source_description:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/status:
    get:
      operationId: getCoreRuntimeStatus
      responses:
        "200":
          $ref: "#/components/responses/RuntimeStatus"
  /core/check:
    post:
      operationId: checkStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/StartupArtifact"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/activate:
    post:
      operationId: activateStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "202":
          $ref: "#/components/responses/ActivationQueued"
  /core/start:
    post:
      operationId: startCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/stop:
    post:
      operationId: stopCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/restart:
    post:
      operationId: restartCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /core/rollback:
    post:
      operationId: rollbackCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /tasks:
    get:
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/TaskLane"
        - $ref: "#/components/parameters/TaskStatus"
        - $ref: "#/components/parameters/TaskKind"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskPage"
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getTask
      responses:
        "200":
          $ref: "#/components/responses/Task"
  /tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Task"
  /subscription/nodes:
    get:
      operationId: listSubscriptionNodes
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionNodeCatalog"
  /subscription/users:
    get:
      operationId: listSubscriptionUsers
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserPage"
    post:
      operationId: createSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionUser"
  /subscription/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUser
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUser"
    put:
      operationId: updateSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUser"
    delete:
      operationId: deleteSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/users/{userId}/grants:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUserGrants
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserGrants"
    put:
      operationId: replaceSubscriptionUserGrants
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionUserGrants"
  /subscription/channels:
    get:
      operationId: listSubscriptionChannels
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannelPage"
    post:
      operationId: createSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionChannel"
  /subscription/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: getSubscriptionChannel
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannel"
    put:
      operationId: updateSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionChannel"
    delete:
      operationId: deleteSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/channels/{channelId}/preview:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    post:
      operationId: previewSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionPreview"
  /subscription/sources:
    get:
      operationId: listSubscriptionSources
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourcePage"
    post:
      operationId: createSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionSource"
  /subscription/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: getSubscriptionSource
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
    put:
      operationId: updateSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
    delete:
      operationId: deleteSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/sources/{sourceId}/refresh:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    post:
      operationId: refreshSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Task"
  /subscription/sources/{sourceId}/versions:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: listSubscriptionSourceVersions
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourceVersionPage"
    post:
      operationId: createSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format, raw_body]
              properties:
                format:
                  type: string
                  enum: [auto, sing-box-json, mihomo-yaml, uri-list]
                raw_body:
                  type: string
                  format: byte
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionSourceVersionSave"
  /subscription/sources/{sourceId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    get:
      operationId: getSubscriptionSourceVersion
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSourceVersion"
  /subscription/sources/{sourceId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    post:
      operationId: restoreSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionSource"
  /subscription/tokens:
    get:
      operationId: listSubscriptionTokens
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionTokenPage"
    post:
      operationId: createSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTokenCreate"
      responses:
        "201":
          $ref: "#/components/responses/CreatedSubscriptionToken"
  /subscription/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    get:
      operationId: getSubscriptionToken
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
    delete:
      operationId: deleteSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/tokens/{tokenId}/rotate:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: rotateSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_at:
                  type: [string, "null"]
                  format: date-time
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionTokenRotation"
  /subscription/tokens/{tokenId}/revoke:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: revokeSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /subscription/tokens/{tokenId}/enable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: enableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /subscription/tokens/{tokenId}/disable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: disableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionToken"
  /sub/{token}/{channelId}:
    servers:
      - url: /
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: downloadSubscription
      security: []
      responses:
        "200":
          description: Rendered subscription for the token user's live grants.
        "304":
          description: The current live publication matches If-None-Match.
  /logs:
    get:
      operationId: listLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LogPage"
    delete:
      operationId: clearLogs
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          $ref: "#/components/responses/LogClearResult"
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: Sanitized durable log stream.
          content:
            text/event-stream:
              schema:
                type: string
  /logs/{logId}:
    parameters:
      - $ref: "#/components/parameters/LogID"
    get:
      operationId: getLog
      responses:
        "200":
          $ref: "#/components/responses/LogEntry"
    delete:
      operationId: deleteLog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/LogDeleteResult"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          $ref: "#/components/responses/MetricsSnapshot"
  /traffic/status:
    get:
      operationId: getTrafficStatus
      responses:
        "200":
          $ref: "#/components/responses/MetricsSnapshot"
  /traffic/periods:
    get:
      operationId: listTrafficPeriods
      parameters:
        - $ref: "#/components/parameters/ActivationBundleFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TrafficPeriodPage"
  /traffic/periods/{periodId}:
    parameters:
      - $ref: "#/components/parameters/TrafficPeriodID"
    get:
      operationId: getTrafficPeriod
      responses:
        "200":
          $ref: "#/components/responses/TrafficPeriod"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbp_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated writes; bearer writes do not require it.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BeforeTime:
      name: before_time
      in: query
      description: Must be supplied together with before_id.
      schema:
        type: string
        format: date-time
    BeforeID:
      name: before_id
      in: query
      description: Must be supplied together with before_time.
      schema:
        type: string
    BeforeSequence:
      name: before_sequence
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    ExactVersion:
      name: exact_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Architecture:
      name: architecture
      in: query
      schema:
        type: string
        enum: [amd64, arm64]
    Variant:
      name: variant
      in: query
      schema:
        $ref: "#/components/schemas/CoreVariant"
    Installable:
      name: installable
      in: query
      schema:
        type: boolean
    CoreSourceKind:
      name: source_kind
      in: query
      schema:
        type: string
        enum: [official, user_verified]
    VerificationState:
      name: verification_state
      in: query
      schema:
        type: string
        enum: [verified, quarantined, revoked]
    CanonicalRevisionFilter:
      name: canonical_revision_id
      in: query
      schema:
        type: string
    CoreVersionFilter:
      name: core_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    CoreArtifactFilter:
      name: core_artifact_id
      in: query
      schema:
        type: string
    StartupStateFilter:
      name: state
      in: query
      schema:
        type: string
        enum: [pending, ready, failed]
    TaskLane:
      name: lane
      in: query
      schema:
        type: string
        enum: [runtime, maintenance]
    TaskStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [queued, running, succeeded, failed, canceled, superseded]
    TaskKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [canonical-saved, catalog-refresh, core-install, core-import, startup-check, subscription-source-refresh, runtime-apply, runtime-start, runtime-stop, runtime-restart, runtime-rollback]
    LogSource:
      name: source
      in: query
      schema:
        type: string
        enum: [panel, core, task, security]
    LogLevel:
      name: level
      in: query
      schema:
        type: string
        enum: [trace, debug, info, warn, error, fatal]
    LogCode:
      name: code
      in: query
      schema:
        type: string
    Since:
      name: since
      in: query
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      schema:
        type: string
        format: date-time
    AfterTime:
      name: after_time
      in: query
      description: Must be supplied together with after_id.
      schema:
        type: string
        format: date-time
    AfterID:
      name: after_id
      in: query
      description: Must be supplied together with after_time.
      schema:
        type: string
    LastEventID:
      name: Last-Event-ID
      in: header
      schema:
        type: string
    ActivationBundleFilter:
      name: activation_bundle_id
      in: query
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    ArtifactID:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    RevisionID:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ChannelID:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    SourceVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    TokenID:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    LogID:
      name: logId
      in: path
      required: true
      schema:
        type: string
    TrafficPeriodID:
      name: periodId
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    StartupArtifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id]
            properties:
              startup_artifact_id:
                type: string
    Activation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id, monitoring_tier]
            properties:
              startup_artifact_id:
                type: string
              monitoring_tier:
                type: string
                enum: [process_only, limited]
    SubscriptionUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionUserInput"
    SubscriptionChannel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionChannelInput"
    SubscriptionSource:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionSourceInput"
  responses:
    Health:
      $ref: "#/components/responses/HealthResponse"
    HealthResponse:
      description: Panel process health and build version.
      content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}
    Session:
      description: Current management session.
      content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
    SystemStatus:
      description: Current control-plane status.
      content: {application/json: {schema: {$ref: "#/components/schemas/SystemStatus"}}}
    DashboardContext:
      description: Dashboard projection of durable and observed state.
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardContext"}}}
    CanonicalSave:
      description: Saved canonical revision.
      content: {application/json: {schema: {$ref: "#/components/schemas/CanonicalSave"}}}
    StartupArtifactPage:
      description: Page of immutable startup artifacts.
      content: {application/json: {schema: {$ref: "#/components/schemas/StartupArtifactPage"}}}
    ActivationQueued:
      description: Activation bundle prepared and runtime task accepted.
      content: {application/json: {schema: {$ref: "#/components/schemas/ActivationQueued"}}}
    CanonicalRevisionPage:
      description: Page of canonical revisions.
      content: {application/json: {schema: {$ref: "#/components/schemas/CanonicalRevisionPage"}}}
    CanonicalRevisionDiff:
      description: Structural diff between two canonical revisions.
      content: {application/json: {schema: {$ref: "#/components/schemas/CanonicalRevisionDiff"}}}
    CanonicalSnapshot:
      description: Immutable canonical revision.
      content: {application/json: {schema: {$ref: "#/components/schemas/CanonicalSnapshot"}}}
    CatalogAssetList:
      description: Filtered catalog assets.
      content: {application/json: {schema: {$ref: "#/components/schemas/CatalogAssetList"}}}
    Task:
      description: Durable task state.
      content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}
    CoreArtifactPage:
      description: Page of immutable core artifacts.
      content: {application/json: {schema: {$ref: "#/components/schemas/CoreArtifactPage"}}}
    CoreArtifact:
      description: Immutable core artifact metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/CoreArtifact"}}}
    RuntimeStatus:
      description: Durable runtime intent and observed process identity.
      content: {application/json: {schema: {$ref: "#/components/schemas/RuntimeStatus"}}}
    TaskPage:
      description: Page of durable tasks.
      content: {application/json: {schema: {$ref: "#/components/schemas/TaskPage"}}}
    SubscriptionNodeCatalog:
      description: Current publishable subscription node catalog.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionNodeCatalog"}}}
    SubscriptionUserPage:
      description: Page of subscription users.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUserPage"}}}
    SubscriptionUser:
      description: Subscription user.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUser"}}}
    SubscriptionUserGrants:
      description: Subscription user and live node grants.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUserGrants"}}}
    SubscriptionChannelPage:
      description: Page of subscription channels.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionChannelPage"}}}
    SubscriptionChannel:
      description: Subscription channel.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionChannel"}}}
    SubscriptionPreview:
      description: Rendered subscription preview and provenance.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPreview"}}}
    SubscriptionSourcePage:
      description: Page of subscription sources.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourcePage"}}}
    SubscriptionSource:
      description: Subscription source.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSource"}}}
    SubscriptionSourceVersionPage:
      description: Page of immutable subscription source versions.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersionPage"}}}
    SubscriptionSourceVersionSave:
      description: Saved source version and advanced source pointer.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersionSave"}}}
    SubscriptionSourceVersion:
      description: Immutable subscription source version.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionSourceVersion"}}}
    SubscriptionTokenPage:
      description: Page of subscription token metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTokenPage"}}}
    CreatedSubscriptionToken:
      description: Token metadata and one-time plaintext token.
      content: {application/json: {schema: {$ref: "#/components/schemas/CreatedSubscriptionToken"}}}
    SubscriptionToken:
      description: Subscription token metadata.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionToken"}}}
    SubscriptionTokenRotation:
      description: Revoked token, replacement metadata, and one-time plaintext token.
      content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTokenRotation"}}}
    LogPage:
      description: Page of sanitized durable logs.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogPage"}}}
    LogClearResult:
      description: Count of deleted log entries.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogClearResult"}}}
    LogEntry:
      description: Sanitized durable log entry.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogEntry"}}}
    LogDeleteResult:
      description: Deleted log identity.
      content: {application/json: {schema: {$ref: "#/components/schemas/LogDeleteResult"}}}
    MetricsSnapshot:
      description: Collector-backed metrics availability and latest evidence.
      content: {application/json: {schema: {$ref: "#/components/schemas/MetricsSnapshot"}}}
    TrafficPeriodPage:
      description: Traffic periods.
      content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPeriodPage"}}}
    TrafficPeriod:
      description: One persisted traffic period.
      content: {application/json: {schema: {$ref: "#/components/schemas/TrafficPeriod"}}}
    NoContent:
      description: Operation completed without a response body.
    Problem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    DynamicObject:
      type: object
      additionalProperties: true
    DynamicValue: {}
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string}
        csrfToken: {type: string}
        expiresAt: {type: string, format: date-time}
    SystemStatus:
      type: object
      additionalProperties: false
      required: [panel_version, canonical_revision, applied_bundle_id, running, running_version, running_artifact, configuration_state]
      properties:
        panel_version: {type: string}
        canonical_revision: {type: integer, format: int64}
        applied_bundle_id: {type: [string, "null"]}
        running: {type: boolean}
        running_version: {type: [string, "null"]}
        running_artifact: {type: [string, "null"]}
        configuration_state: {type: string}
    DashboardContext:
      type: object
      additionalProperties: false
      required: [view, running, canonical, applied, adapter]
      properties:
        view:
          type: object
          additionalProperties: false
          required: [exactVersion]
          properties: {exactVersion: {type: string}}
        running:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DashboardRuntime"
        canonical:
          type: object
          additionalProperties: false
          required: [revision, savedAt, hasUnappliedChanges]
          properties:
            revision: {type: integer, format: int64}
            savedAt: {type: string, format: date-time}
            hasUnappliedChanges: {type: boolean}
        applied:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DashboardApplied"
        adapter:
          type: object
          additionalProperties: false
          required: [supported, label, warning]
          properties:
            supported: {type: boolean}
            label: {type: string}
            warning: {type: [string, "null"]}
    DashboardRuntime:
      type: object
      additionalProperties: false
      required: [exactVersion, artifactName, digest]
      properties:
        exactVersion: {type: string}
        artifactName: {type: string}
        digest: {type: string}
    DashboardApplied:
      type: object
      additionalProperties: false
      required: [bundle, revision, appliedAt]
      properties:
        bundle: {type: string}
        revision: {type: integer, format: int64}
        appliedAt: {type: string, format: date-time}
    CreatedAtCursor:
      type: object
      additionalProperties: false
      required: [created_at, id]
      properties:
        created_at: {type: string, format: date-time}
        id: {type: string}
    Task:
      type: object
      additionalProperties: false
      required: [id, lane, kind, status, generation, payload, cancel_requested, attempt, created_at, updated_at]
      properties:
        id: {type: string}
        idempotency_key: {type: string}
        lane: {type: string, enum: [runtime, maintenance]}
        kind:
          type: string
          enum: [canonical-saved, catalog-refresh, core-install, core-import, startup-check, subscription-source-refresh, runtime-apply, runtime-start, runtime-stop, runtime-restart, runtime-rollback]
        status: {type: string, enum: [queued, running, succeeded, failed, canceled, superseded]}
        generation: {type: integer, format: int64, minimum: 0}
        canonical_revision_id: {type: string}
        startup_artifact_id: {type: string}
        activation_bundle_id: {type: string}
        payload: {$ref: "#/components/schemas/DynamicValue"}
        result: {$ref: "#/components/schemas/DynamicValue"}
        failure: {$ref: "#/components/schemas/DynamicValue"}
        cancel_requested: {type: boolean}
        attempt: {type: integer, minimum: 0}
        lease_expires_at: {type: string, format: date-time}
        not_before: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaskPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Task"}}
        next: {$ref: "#/components/schemas/CreatedAtCursor"}
    RuntimeIdentity:
      type: object
      additionalProperties: false
      required: [pid, process_start_token, exact_core_version, core_artifact_id, archive_sha256, binary_sha256, activation_bundle_id]
      properties:
        pid: {type: integer, minimum: 1}
        process_start_token: {type: string}
        exact_core_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        core_artifact_id: {type: string}
        archive_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_sha256: {$ref: "#/components/schemas/SHA256"}
        activation_bundle_id: {type: string}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [desired_running, target_generation, observation_state]
      properties:
        desired_running: {type: boolean}
        desired_bundle_id: {type: string}
        applied_bundle_id: {type: string}
        rollback_bundle_id: {type: string}
        target_generation: {type: integer, format: int64, minimum: 0}
        observation_state: {type: string, enum: [stopped, running, stale, inspection_unavailable]}
        running: {$ref: "#/components/schemas/RuntimeIdentity"}
    ExactCoreVersion:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    CoreVariant:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9._-]*$'
    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    CoreArtifact:
      type: object
      additionalProperties: false
      required: [id, exact_version, os, arch, variant, source_kind, archive_sha256, binary_sha256, binary_path, reported_version, feature_fingerprint, verification_state, created_at]
      properties:
        id: {type: string}
        exact_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        os: {type: string, const: linux}
        arch: {type: string, enum: [amd64, arm64]}
        variant: {$ref: "#/components/schemas/CoreVariant"}
        source_kind: {type: string, enum: [official, user_verified]}
        user_source: {type: string}
        repository_id: {type: integer, format: int64, minimum: 1}
        release_id: {type: integer, format: int64, minimum: 1}
        asset_id: {type: integer, format: int64, minimum: 1}
        archive_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_sha256: {$ref: "#/components/schemas/SHA256"}
        binary_path: {type: string}
        reported_version: {$ref: "#/components/schemas/ExactCoreVersion"}
        feature_fingerprint: {$ref: "#/components/schemas/DynamicObject"}
        verification_state: {type: string, enum: [verified, quarantined, revoked]}
        created_at: {type: string, format: date-time}
    CoreArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CoreArtifact"}}
        next: {$ref: "#/components/schemas/CreatedAtCursor"}
    CatalogAsset:
      type: object
      additionalProperties: false
      required: [repository_id, release_id, asset_id, name, download_url, size, version, os, arch, variant, has_api_digest, has_catalog_digest]
      properties:
        repository_id: {type: integer, format: int64, minimum: 1}
        release_id: {type: integer, format: int64, minimum: 1}
        asset_id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        download_url: {type: string, format: uri}
        size: {type: integer, format: int64, minimum: 0}
        version: {$ref: "#/components/schemas/ExactCoreVersion"}
        os: {type: string, const: linux}
        arch: {type: string, enum: [amd64, arm64]}
        variant: {$ref: "#/components/schemas/CoreVariant"}
        api_digest: {$ref: "#/components/schemas/SHA256"}
        catalog_digest: {$ref: "#/components/schemas/SHA256"}
        has_api_digest: {type: boolean}
        has_catalog_digest: {type: boolean}
    CatalogAssetList:
      type: object
      additionalProperties: false
      required: [validator, refreshed_at, assets]
      properties:
        validator: {type: string}
        refreshed_at: {type: string, format: date-time}
        assets: {type: array, items: {$ref: "#/components/schemas/CatalogAsset"}}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    CanonicalDocument:
      type: object
      additionalProperties: false
      required: [schema_version, configuration]
      properties:
        schema_version:
          type: integer
          const: 2
        configuration:
          type: object
          description: >-
            Version-independent superset intent. Managed top-level collection
            items carry an _panel object with a stable id and enabled flag.
          additionalProperties: true
    CanonicalSnapshot:
      type: object
      required: [id, sequence, schema_version, document, document_json, sha256, created_at]
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
        parent_id:
          type: string
        schema_version:
          type: integer
          const: 2
        document:
          $ref: "#/components/schemas/CanonicalDocument"
        document_json:
          type: string
          description: Lossless JSON representation for clients that preserve large integers.
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
    CanonicalChange:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [set, unset]
        path:
          type: string
        value_json:
          type: string
    CanonicalSave:
      type: object
      required: [revision, no_change]
      properties:
        revision:
          $ref: "#/components/schemas/CanonicalSnapshot"
        no_change:
          type: boolean
        task_id:
          type: string
    CanonicalRevisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CanonicalSnapshot"}}
        next_before_sequence: {type: integer, format: int64, minimum: 1}
    CanonicalDiffValue:
      type: object
      additionalProperties: false
      required: [present]
      properties:
        present: {type: boolean}
        value: {$ref: "#/components/schemas/DynamicValue"}
    CanonicalRevisionDiff:
      type: object
      additionalProperties: false
      required: [from, to, changes]
      properties:
        from: {$ref: "#/components/schemas/CanonicalSnapshot"}
        to: {$ref: "#/components/schemas/CanonicalSnapshot"}
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, from, to]
            properties:
              path: {type: string}
              from: {$ref: "#/components/schemas/CanonicalDiffValue"}
              to: {$ref: "#/components/schemas/CanonicalDiffValue"}
    ConfigurationProfile:
      type: object
      required: [exact_version, os, arch, variant, feature_fingerprint]
      properties:
        exact_version:
          type: string
        os:
          type: string
        arch:
          type: string
        variant:
          $ref: "#/components/schemas/CoreVariant"
        feature_fingerprint:
          $ref: "#/components/schemas/DynamicObject"
    ConfigurationAdapterSupport:
      type: object
