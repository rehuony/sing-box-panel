              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    managementBearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbp_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated state-changing requests.
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current canonical revision ID.
      schema: { type: string }
    RevisionID:
      name: revisionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    EntityID:
      name: entityId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9._-]{0,127}$" }
    TaskID:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    CoreArtifactID:
      name: artifactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    StartupArtifactID:
      name: startupArtifactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    SubscriptionChannelID:
      name: channelId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SubscriptionSourceID:
      name: sourceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SubscriptionTokenID:
      name: tokenId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SubscriptionIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted RFC 3339 updated_at value from the current resource ETag.
      schema: { type: string }
    ExactVersionQuery:
      name: exact_version
      in: query
      schema: { $ref: "#/components/schemas/ExactCoreVersion" }
    CoreArchitectureQuery:
      name: architecture
      in: query
      schema: { $ref: "#/components/schemas/CoreArchitecture" }
    CoreVariantQuery:
      name: variant
      in: query
      schema: { $ref: "#/components/schemas/CoreVariant" }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Problem:
      description: Stable RFC 9457-compatible problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CanonicalSave:
      description: Canonical head after a compare-and-swap mutation.
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CanonicalSave" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
        csrfToken:
          type: string
          description: Present for cookie sessions so the browser can make writes.
        expiresAt:
          type: string
          format: date-time
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - panel_version
        - canonical_revision
        - running
        - capability_state
      properties:
        panel_version:
          type: string
        canonical_revision:
          type: integer
          format: int64
          minimum: 0
        applied_bundle_id:
          type: [string, "null"]
        running:
          type: boolean
        running_version:
          type: [string, "null"]
        running_artifact:
          type: [string, "null"]
        capability_state:
          type: string
          enum: [unavailable, unresolved, native_structured, compatible_structured, manual_json, quarantined_manual_json]
          description: Exact-version capability state for the running core, or the applied bundle while stopped; never an assumed latest-version state.
    DashboardContext:
      type: object
      additionalProperties: false
      required: [view, running, canonical, applied, capability]
      properties:
        view:
          type: object
          additionalProperties: false
          required: [exactVersion]
          properties:
            exactVersion:
              type: string
        running:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [exactVersion, artifactName, digest]
              properties:
                exactVersion: { type: string }
                artifactName: { type: string }
                digest: { type: string }
        canonical:
          type: object
          additionalProperties: false
          required: [revision, savedAt, hasUnappliedChanges]
          properties:
            revision: { type: integer, format: int64, minimum: 0 }
            savedAt: { type: string, format: date-time }
            hasUnappliedChanges: { type: boolean }
        applied:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [bundle, revision, appliedAt]
              properties:
                bundle: { type: string, minLength: 1 }
                revision: { type: integer, format: int64, minimum: 1 }
                appliedAt: { type: string, format: date-time }
        capability:
          type: object
          additionalProperties: false
          required: [level, label, warning]
          properties:
            level:
              type: string
              enum: [native_structured, compatible_structured, manual_json, unavailable]
            label: { type: string }
            warning: { type: [string, "null"] }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    CanonicalDocument:
      type: object
      additionalProperties: false
      required: [schema_version, global, nodes, rules, subscription]
      properties:
        schema_version: { type: integer, const: 1 }
        global: { type: object, additionalProperties: true }
        nodes:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, kind, enabled]
            properties:
              id: { type: string }
              kind: { type: string }
              enabled: { type: boolean }
            additionalProperties: true
        rules:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, enabled]
            properties:
              id: { type: string }
              enabled: { type: boolean }
            additionalProperties: true
        subscription: { type: object, additionalProperties: true }
    CanonicalSnapshot:
      type: object
      additionalProperties: false
      required: [id, sequence, schema_version, document, document_json, sha256, created_at]
      properties:
        id: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        parent_id: { type: string }
        schema_version: { type: integer, const: 1 }
        document: { $ref: "#/components/schemas/CanonicalDocument" }
        document_json:
          type: string
          description: Exact canonical JSON bytes encoded as a JSON string for lossless browser parsing.
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }
    CanonicalChange:
      type: object
      additionalProperties: false
      required: [op, path]
      properties:
        op:
          type: string
          enum: [set, unset]
        path: { type: string, minLength: 1, maxLength: 4096 }
        value_json:
          type: string
          description: Required for set and forbidden for unset; contains exactly one JSON value without numeric coercion.
    CanonicalPatchRequest:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: "#/components/schemas/CanonicalChange" }
    CanonicalSave:
      type: object
      additionalProperties: false
      required: [revision, no_change]
      properties:
        revision: { $ref: "#/components/schemas/CanonicalSnapshot" }
        task_id: { type: string }
        no_change: { type: boolean }
    CanonicalRevisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CanonicalSnapshot" }
        next_before_sequence: { type: integer, format: int64, minimum: 1 }
    DiffValue:
      type: object
      additionalProperties: false
      required: [present]
      properties:
        present: { type: boolean }
        value: {}
    CanonicalDiffEntry:
      type: object
      additionalProperties: false
      required: [path, from, to]
      properties:
        path: { type: string }
        from: { $ref: "#/components/schemas/DiffValue" }
        to: { $ref: "#/components/schemas/DiffValue" }
    CanonicalRevisionDiff:
      type: object
      additionalProperties: false
      required: [from, to, changes]
      properties:
        from: { $ref: "#/components/schemas/CanonicalSnapshot" }
        to: { $ref: "#/components/schemas/CanonicalSnapshot" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CanonicalDiffEntry" }
    Node:
      type: object
      required: [id, kind, enabled]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9._-]{0,127}$" }
        kind: { type: string, pattern: "^[a-z][a-z0-9._-]{0,127}$" }
        enabled: { type: boolean }
      additionalProperties: true
    Rule:
      type: object
      required: [id, enabled]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9._-]{0,127}$" }
        enabled: { type: boolean }
      additionalProperties: true
    Entity:
      oneOf:
        - $ref: "#/components/schemas/Node"
        - $ref: "#/components/schemas/Rule"
    EntityList:
      type: object
      additionalProperties: false
      required: [revision, entities]
      properties:
        revision: { $ref: "#/components/schemas/CanonicalSnapshot" }
        entities:
          type: array
          items: { $ref: "#/components/schemas/Entity" }
    EntityResult:
      type: object
      additionalProperties: false
      required: [revision, entity]
      properties:
        revision: { $ref: "#/components/schemas/CanonicalSnapshot" }
        entity: { $ref: "#/components/schemas/Entity" }
    EnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    MoveRequest:
      type: object
      additionalProperties: false
      properties:
        before_id:
          type: string
          description: Omit or use an empty string to move the entity to the end.
    ExactCoreVersion:
      type: string
      description: A non-zero exact stable semantic version without a leading v, prerelease, or build metadata.
      maxLength: 62
      pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
      not: { const: "0.0.0" }
    SHA256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    GitObjectID:
      type: string
      pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$"
    CoreArchitecture:
      type: string
      enum: [amd64, arm64]
    CoreVariant:
      type: string
      pattern: "^[a-z][a-z0-9._-]{0,63}$"
    CoreArtifactSourceKind:
      type: string
      enum: [official, user_verified]
    CoreArtifactVerificationState:
      type: string
      enum: [verified, revoked, quarantined]
    CapabilitySupportLevel:
      type: string
      enum: [native_structured, compatible_structured, manual_json, unavailable]
    CatalogAsset:
      type: object
      additionalProperties: false
      required:
        - repository_id
        - release_id
        - asset_id
        - name
        - download_url
        - size
        - version
        - os
        - arch
        - variant
        - has_api_digest
        - has_catalog_digest
      properties:
        repository_id: { type: integer, format: int64, minimum: 1 }
        release_id: { type: integer, format: int64, minimum: 1 }
        asset_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 512 }
        download_url: { type: string, format: uri }
        size: { type: integer, format: int64, minimum: 1 }
        version: { $ref: "#/components/schemas/ExactCoreVersion" }
        os: { type: string, const: linux }
        arch: { $ref: "#/components/schemas/CoreArchitecture" }
        variant: { $ref: "#/components/schemas/CoreVariant" }
        api_digest: { $ref: "#/components/schemas/SHA256" }
        has_api_digest: { type: boolean }
        catalog_digest: { $ref: "#/components/schemas/SHA256" }
        has_catalog_digest: { type: boolean }
    CatalogAssetList:
      type: object
      additionalProperties: false
      required: [validator, refreshed_at, assets]
      properties:
        validator: { type: string }
        refreshed_at: { type: string, format: date-time }
        assets:
          type: array
          items: { $ref: "#/components/schemas/CatalogAsset" }
    CoreArtifact:
      type: object
      additionalProperties: false
      required:
        - id
        - exact_version
        - os
        - arch
        - variant
        - source_kind
        - archive_sha256
        - binary_sha256
        - binary_path
        - reported_version
        - feature_fingerprint
        - verification_state
        - created_at
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        exact_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        os: { type: string, const: linux }
        arch: { $ref: "#/components/schemas/CoreArchitecture" }
        variant: { $ref: "#/components/schemas/CoreVariant" }
        source_kind: { $ref: "#/components/schemas/CoreArtifactSourceKind" }
        user_source: { type: string, minLength: 1, maxLength: 512 }
        repository_id: { type: integer, format: int64, minimum: 1 }
        release_id: { type: integer, format: int64, minimum: 1 }
        asset_id: { type: integer, format: int64, minimum: 1 }
        archive_sha256: { $ref: "#/components/schemas/SHA256" }
        binary_sha256: { $ref: "#/components/schemas/SHA256" }
        binary_path:
          type: string
          minLength: 1
          readOnly: true
        reported_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        feature_fingerprint: {}
        verification_state: { $ref: "#/components/schemas/CoreArtifactVerificationState" }
        created_at: { type: string, format: date-time }
    CoreArtifactCursor:
      type: object
      additionalProperties: false
      required: [created_at, id]
      properties:
        created_at: { type: string, format: date-time }
        id: { type: string, minLength: 1, maxLength: 256 }
    CoreArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CoreArtifact" }
        next: { $ref: "#/components/schemas/CoreArtifactCursor" }
    CoreInstallRequest:
      type: object
      additionalProperties: false
      required: [asset_id]
      properties:
        asset_id: { type: integer, format: int64, minimum: 1 }
    CoreImportRequest:
      type: object
      additionalProperties: false
      required: [source_path, source_description, sha256, exact_version, architecture]
      properties:
        source_path:
          type: string
          pattern: "^/"
          minLength: 1
          maxLength: 32768
          writeOnly: true
          description: Absolute, clean local path visible to the panel process.
        source_description:
          type: string
          minLength: 1
          maxLength: 512
          description: Trimmed UTF-8 description limited to 512 encoded bytes.
        sha256: { $ref: "#/components/schemas/SHA256" }
        exact_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        architecture: { $ref: "#/components/schemas/CoreArchitecture" }
        variant:
          allOf:
            - $ref: "#/components/schemas/CoreVariant"
          default: plain
    RuntimeCoreIdentity:
      type: object
      additionalProperties: false
      required:
        - pid
        - process_start_token
        - exact_core_version
        - core_artifact_id
        - archive_sha256
        - binary_sha256
        - activation_bundle_id
      properties:
        pid: { type: integer, minimum: 1 }
        process_start_token: { type: string }
        exact_core_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        core_artifact_id: { type: string }
        archive_sha256: { $ref: "#/components/schemas/SHA256" }
        binary_sha256: { $ref: "#/components/schemas/SHA256" }
        activation_bundle_id: { type: string }
    CoreVersionResolution:
      type: object
      additionalProperties: false
      required: [exact_version, source]
      properties:
        exact_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        source:
          type: string
          enum: [explicit, running]
        running: { $ref: "#/components/schemas/RuntimeCoreIdentity" }
    CapabilityPin:
      type: object
      additionalProperties: false
      description: Persisted immutable capability reference.
      required: [exact_core_version, repository, commit_sha, manifest_sha256, support_level, pinned_at]
      properties:
        exact_core_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        repository: { type: string, pattern: "^[^/]+/[^/]+$" }
        commit_sha: { $ref: "#/components/schemas/GitObjectID" }
        manifest_sha256: { $ref: "#/components/schemas/SHA256" }
        support_level: { $ref: "#/components/schemas/CapabilitySupportLevel" }
        pinned_at: { type: string, format: date-time }
    CapabilityManifest:
      type: object
      additionalProperties: false
      required: [schema_version, core_version, support_level, semantic_facts]
      properties:
        schema_version: { type: integer, const: 1 }
        core_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        support_level: { $ref: "#/components/schemas/CapabilitySupportLevel" }
        semantic_facts:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/CapabilitySemanticFact" }
        transforms:
          type: array
          maxItems: 4096
          items:
            type: object
            description: One strictly validated built-in data transformation; scripts and remote references are forbidden.
        ui:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/CapabilityUIDescriptor" }
    CapabilitySemanticFact:
      type: object
      additionalProperties: false
      required: [id, canonical_path, classification]
      properties:
        id: { type: string }
        canonical_path: { type: string }
        classification:
          type: string
          enum: [supported, intentionally_unsupported, behavior_changed]
        owned_paths:
          type: array
          items: { type: string }
    CapabilityUIOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    CapabilityVisibilityCondition:
      type: object
      additionalProperties: false
      required: [canonical_path, equals]
      properties:
        canonical_path: { type: string }
        equals:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
    CapabilityUIDescriptor:
      type: object
      additionalProperties: false
      description: A validated descriptor for built-in controls only; executable components, templates, and remote resources are forbidden.
      required: [id, fact_id, kind, label]
      properties:
        id: { type: string }
        fact_id: { type: string }
        kind:
          type: string
          enum: [group, text, number, boolean, select, json]
        label: { type: string }
        help: { type: string }
        order: { type: integer, minimum: 0, maximum: 1000000 }
        options:
          type: array
          items: { $ref: "#/components/schemas/CapabilityUIOption" }
        visible_when: { $ref: "#/components/schemas/CapabilityVisibilityCondition" }
    CapabilityPresentation:
      type: object
      additionalProperties: false
      required: [semantic_facts, ui]
      properties:
        semantic_facts:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/CapabilitySemanticFact" }
        ui:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/CapabilityPresentationUIDescriptor" }
    CapabilityPresentationVisibilityCondition:
      type: object
      additionalProperties: false
      required: [canonical_path, equals_json]
      properties:
        canonical_path: { type: string }
        equals_json:
          type: string
          description: Exact JSON spelling of the validated scalar, preventing browser numeric coercion.
    CapabilityPresentationUIDescriptor:
      type: object
      additionalProperties: false
      description: An inert, validated descriptor consumed only by panel-owned built-in controls.
      required: [id, fact_id, kind, label]
      properties:
        id: { type: string }
        fact_id: { type: string }
        kind:
          type: string
          enum: [group, text, number, boolean, select, json]
        label: { type: string }
        help: { type: string }
        order: { type: integer, minimum: 0, maximum: 1000000 }
        options:
          type: array
          items: { $ref: "#/components/schemas/CapabilityUIOption" }
        visible_when: { $ref: "#/components/schemas/CapabilityPresentationVisibilityCondition" }
    CapabilityGenerationManifestInput:
      type: object
      additionalProperties: false
      required: [path, manifest_sha256, manifest]
      properties:
        path: { type: string, pattern: "^capabilities/[0-9]+\\.[0-9]+\\.[0-9]+\\.json$" }
        manifest_sha256: { $ref: "#/components/schemas/SHA256" }
        manifest: { $ref: "#/components/schemas/CapabilityManifest" }
    CapabilityGenerationInput:
      type: object
      additionalProperties: false
      required: [schema_version, repository, commit_sha, manifest_count, manifests]
      properties:
        schema_version: { type: integer, const: 1 }
        repository: { type: string, const: rehuony/sing-box-panel }
        commit_sha: { $ref: "#/components/schemas/GitObjectID" }
        manifest_count: { type: integer, minimum: 1, maximum: 4096 }
        manifests:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: "#/components/schemas/CapabilityGenerationManifestInput" }
    CapabilityGenerationView:
      type: object
      additionalProperties: false
      required: [id, repository, commit_sha, source_sha256, manifest_count, refreshed_at]
      properties:
        id: { type: string }
        repository: { type: string, const: rehuony/sing-box-panel }
        commit_sha: { $ref: "#/components/schemas/GitObjectID" }
        source_sha256: { $ref: "#/components/schemas/SHA256" }
        manifest_count: { type: integer, minimum: 1, maximum: 4096 }
        refreshed_at: { type: string, format: date-time }
    CapabilityGenerationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CapabilityGenerationView" }
    CapabilityManifestCandidate:
      type: object
      additionalProperties: false
      required:
        - generation_id
        - repository
        - commit_sha
        - exact_core_version
        - path
        - manifest_sha256
        - support_level
        - quarantined
      properties:
        generation_id: { type: string }
        repository: { type: string, const: rehuony/sing-box-panel }
        commit_sha: { $ref: "#/components/schemas/GitObjectID" }
        exact_core_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        path: { type: string }
        manifest_sha256: { $ref: "#/components/schemas/SHA256" }
        support_level: { $ref: "#/components/schemas/CapabilitySupportLevel" }
        manifest: { $ref: "#/components/schemas/CapabilityManifest" }
        quarantined: { type: boolean }
        reason_code: { type: string }
    CapabilityGenerationRefresh:
      type: object
      additionalProperties: false
      required: [generation, candidates, created]
      properties:
        generation: { $ref: "#/components/schemas/CapabilityGenerationView" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CapabilityManifestCandidate" }
        created: { type: boolean }
    CapabilityQuarantineReasonCode:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z0-9](?:[a-z0-9_]{1,62}[a-z0-9])$"
      description: Stable lowercase machine-readable reason code recorded in the immutable quarantine audit entry.
    CapabilityQuarantineRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { $ref: "#/components/schemas/CapabilityQuarantineReasonCode" }
    CapabilityQuarantine:
      type: object
      additionalProperties: false
      required: [manifest_sha256, reason_code, quarantined_at]
      properties:
        manifest_sha256: { $ref: "#/components/schemas/SHA256" }
        reason_code: { $ref: "#/components/schemas/CapabilityQuarantineReasonCode" }
        quarantined_at: { type: string, format: date-time }
    CapabilityUpgradeRequest:
      type: object
      additionalProperties: false
      required: [exact_core_version, commit_sha, manifest_sha256, accept]
      properties:
        exact_core_version: { $ref: "#/components/schemas/ExactCoreVersion" }
        commit_sha: { $ref: "#/components/schemas/GitObjectID" }
        manifest_sha256: { $ref: "#/components/schemas/SHA256" }
        accept:
          type: boolean
          description: false returns only a preview; true explicitly accepts and pins the exact candidate.
    CapabilityUpgradePreview:
      type: object
      additionalProperties: false
      required: [candidate, changed, blocked, warnings]
      properties:
        current: { $ref: "#/components/schemas/CapabilityPin" }
        candidate: { $ref: "#/components/schemas/CapabilityManifestCandidate" }
        changed: { type: boolean }
        blocked: { type: boolean }
        block_reason: { type: string }
        warnings:
          type: array
          items: { type: string }
    CapabilityUpgrade:
      type: object
      additionalProperties: false
      required: [preview, pin]
      properties:
        preview: { $ref: "#/components/schemas/CapabilityUpgradePreview" }
        pin: { $ref: "#/components/schemas/CapabilityPin" }
    CoreCapabilityStatus:
      type: object
      additionalProperties: false
      required: [resolution, support_level, pinned, quarantined]
      properties:
        resolution: { $ref: "#/components/schemas/CoreVersionResolution" }
        support_level: { $ref: "#/components/schemas/CapabilitySupportLevel" }
        pinned: { type: boolean }
        pin: { $ref: "#/components/schemas/CapabilityPin" }
        quarantined: { type: boolean }
        reason_code: { type: string }
        presentation:
          allOf:
            - { $ref: "#/components/schemas/CapabilityPresentation" }
