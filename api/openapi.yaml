openapi: 3.1.0
info:
  title: sing-box-panel API
  version: 0.2.0
  description: >-
    Local management API for one version-independent sing-box configuration
    history, exact compiled adapters, immutable startup artifacts, runtime
    operations, live subscription publication, and sanitized observability.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /dashboard/context:
    get:
      operationId: getDashboardContext
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/canonical:
    get:
      operationId: getCanonicalConfiguration
      responses:
        "200":
          description: Current global immutable revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSnapshot"
    put:
      operationId: replaceCanonicalConfiguration
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalDocument"
      responses:
        "200":
          description: Saved global revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSave"
    patch:
      operationId: patchCanonicalConfiguration
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items:
                    $ref: "#/components/schemas/CanonicalChange"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/preview:
    post:
      operationId: previewConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
                canonical_revision_id:
                  type: string
      responses:
        "200":
          description: Non-persisted projection through the exact adapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPreview"
  /config/compile:
    post:
      operationId: compileConfiguration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [core_artifact_id]
              properties:
                core_artifact_id:
                  type: string
                accepted_ignored_digest:
                  type: string
      responses:
        "202":
          description: Immutable compiled candidate and queued exact-core check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationCompile"
  /config/artifacts:
    get:
      operationId: listStartupArtifacts
      parameters:
        - $ref: "#/components/parameters/CanonicalRevisionFilter"
        - $ref: "#/components/parameters/CoreVersionFilter"
        - $ref: "#/components/parameters/CoreArtifactFilter"
        - $ref: "#/components/parameters/StartupStateFilter"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/apply:
    post:
      operationId: applyStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /config/revisions:
    get:
      operationId: listCanonicalRevisions
      parameters:
        - $ref: "#/components/parameters/BeforeSequence"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/revisions/diff:
    get:
      operationId: diffCanonicalRevisions
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/RevisionID"
    get:
      operationId: getCanonicalRevision
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /config/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/RevisionID"
    post:
      operationId: restoreCanonicalRevision
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/catalog/assets:
    get:
      operationId: listCoreCatalogAssets
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/Installable"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/catalog/refresh:
    post:
      operationId: refreshCoreCatalog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [force]
              properties:
                force:
                  type: boolean
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/artifacts:
    get:
      operationId: listCoreArtifacts
      parameters:
        - $ref: "#/components/parameters/ExactVersion"
        - $ref: "#/components/parameters/Architecture"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/CoreSourceKind"
        - $ref: "#/components/parameters/VerificationState"
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifact
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /core/artifacts/{artifactId}/configuration-support:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getCoreArtifactConfigurationSupport
      responses:
        "200":
          description: Exact compiled adapter support for the complete binary profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationAdapterSupport"
  /core/artifacts/{artifactId}/quarantine:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: quarantineCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/artifacts/{artifactId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      operationId: revokeCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/install:
    post:
      operationId: installCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_id]
              properties:
                asset_id:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/import:
    post:
      operationId: importCoreArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive, sha256, exact_version, architecture, variant]
              properties:
                archive:
                  type: string
                  format: binary
                sha256:
                  type: string
                exact_version:
                  type: string
                architecture:
                  type: string
                variant:
                  type: string
                source_description:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/status:
    get:
      operationId: getCoreRuntimeStatus
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /core/check:
    post:
      operationId: checkStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/StartupArtifact"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/activate:
    post:
      operationId: activateStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/Activation"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/start:
    post:
      operationId: startCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/stop:
    post:
      operationId: stopCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/restart:
    post:
      operationId: restartCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /core/rollback:
    post:
      operationId: rollbackCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /tasks:
    get:
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/TaskLane"
        - $ref: "#/components/parameters/TaskStatus"
        - $ref: "#/components/parameters/TaskKind"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getTask
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/nodes:
    get:
      operationId: listSubscriptionNodes
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/users:
    get:
      operationId: listSubscriptionUsers
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    post:
      operationId: createSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUser
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      operationId: updateSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUser"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteSubscriptionUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/users/{userId}/grants:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getSubscriptionUserGrants
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      operationId: replaceSubscriptionUserGrants
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/channels:
    get:
      operationId: listSubscriptionChannels
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    post:
      operationId: createSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: getSubscriptionChannel
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      operationId: updateSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChannel"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/channels/{channelId}/preview:
    parameters:
      - $ref: "#/components/parameters/ChannelID"
    post:
      operationId: previewSubscriptionChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/sources:
    get:
      operationId: listSubscriptionSources
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    post:
      operationId: createSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: getSubscriptionSource
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      operationId: updateSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionSource"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/sources/{sourceId}/refresh:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    post:
      operationId: refreshSubscriptionSource
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /subscription/sources/{sourceId}/versions:
    parameters:
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: listSubscriptionSourceVersions
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    post:
      operationId: createSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format, raw_body]
              properties:
                format:
                  type: string
                  enum: [auto, sing-box-json, mihomo-yaml, uri-list]
                raw_body:
                  type: string
                  format: byte
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/sources/{sourceId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    get:
      operationId: getSubscriptionSourceVersion
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/sources/{sourceId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SourceID"
      - $ref: "#/components/parameters/SourceVersionID"
    post:
      operationId: restoreSubscriptionSourceVersion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/tokens:
    get:
      operationId: listSubscriptionTokens
      parameters:
        - $ref: "#/components/parameters/BeforeTime"
        - $ref: "#/components/parameters/BeforeID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    post:
      operationId: createSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTokenCreate"
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    get:
      operationId: getSubscriptionToken
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /subscription/tokens/{tokenId}/rotate:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: rotateSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_at:
                  type: [string, "null"]
                  format: date-time
      responses:
        "201":
          $ref: "#/components/responses/JSON"
  /subscription/tokens/{tokenId}/revoke:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: revokeSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/tokens/{tokenId}/enable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: enableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /subscription/tokens/{tokenId}/disable:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    post:
      operationId: disableSubscriptionToken
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /sub/{token}/{channelId}:
    servers:
      - url: /
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: downloadSubscription
      security: []
      responses:
        "200":
          description: Rendered subscription for the token user's live grants.
        "304":
          description: The current live publication matches If-None-Match.
  /logs:
    get:
      operationId: listLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: clearLogs
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogCode"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/AfterTime"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: Sanitized durable log stream.
          content:
            text/event-stream:
              schema:
                type: string
  /logs/{logId}:
    parameters:
      - $ref: "#/components/parameters/LogID"
    get:
      operationId: getLog
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      operationId: deleteLog
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /traffic/status:
    get:
      operationId: getTrafficStatus
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /traffic/periods:
    get:
      operationId: listTrafficPeriods
      parameters:
        - $ref: "#/components/parameters/ActivationBundleFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
  /traffic/periods/{periodId}:
    parameters:
      - $ref: "#/components/parameters/TrafficPeriodID"
    get:
      operationId: getTrafficPeriod
      responses:
        "200":
          $ref: "#/components/responses/JSON"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbp_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated writes; bearer writes do not require it.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BeforeTime:
      name: before_time
      in: query
      description: Must be supplied together with before_id.
      schema:
        type: string
        format: date-time
    BeforeID:
      name: before_id
      in: query
      description: Must be supplied together with before_time.
      schema:
        type: string
    BeforeSequence:
      name: before_sequence
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    ExactVersion:
      name: exact_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Architecture:
      name: architecture
      in: query
      schema:
        type: string
        enum: [amd64, arm64]
    Variant:
      name: variant
      in: query
      schema:
        type: string
    Installable:
      name: installable
      in: query
      schema:
        type: boolean
    CoreSourceKind:
      name: source_kind
      in: query
      schema:
        type: string
        enum: [official, user_verified]
    VerificationState:
      name: verification_state
      in: query
      schema:
        type: string
        enum: [verified, quarantined, revoked]
    CanonicalRevisionFilter:
      name: canonical_revision_id
      in: query
      schema:
        type: string
    CoreVersionFilter:
      name: core_version
      in: query
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    CoreArtifactFilter:
      name: core_artifact_id
      in: query
      schema:
        type: string
    StartupStateFilter:
      name: state
      in: query
      schema:
        type: string
        enum: [pending, ready, failed]
    TaskLane:
      name: lane
      in: query
      schema:
        type: string
        enum: [runtime, maintenance]
    TaskStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [queued, running, succeeded, failed, canceled, superseded]
    TaskKind:
      name: kind
      in: query
      schema:
        type: string
    LogSource:
      name: source
      in: query
      schema:
        type: string
    LogLevel:
      name: level
      in: query
      schema:
        type: string
    LogCode:
      name: code
      in: query
      schema:
        type: string
    Since:
      name: since
      in: query
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      schema:
        type: string
        format: date-time
    AfterTime:
      name: after_time
      in: query
      description: Must be supplied together with after_id.
      schema:
        type: string
        format: date-time
    AfterID:
      name: after_id
      in: query
      description: Must be supplied together with after_time.
      schema:
        type: string
    LastEventID:
      name: Last-Event-ID
      in: header
      schema:
        type: string
    ActivationBundleFilter:
      name: activation_bundle_id
      in: query
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    ArtifactID:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    RevisionID:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ChannelID:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    SourceVersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    TokenID:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    LogID:
      name: logId
      in: path
      required: true
      schema:
        type: string
    TrafficPeriodID:
      name: periodId
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    StartupArtifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id]
            properties:
              startup_artifact_id:
                type: string
    Activation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [startup_artifact_id, monitoring_tier]
            properties:
              startup_artifact_id:
                type: string
              monitoring_tier:
                type: string
                enum: [process_only, limited, full]
    SubscriptionUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionUserInput"
    SubscriptionChannel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionChannelInput"
    SubscriptionSource:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionSourceInput"
  responses:
    JSON:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnyObject"
    Accepted:
      description: Durable task accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnyObject"
    NoContent:
      description: Operation completed without a response body.
    Problem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AnyObject:
      type: object
      additionalProperties: true
    Problem:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
        detail:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    CanonicalDocument:
      type: object
      additionalProperties: false
      required: [schema_version, configuration]
      properties:
        schema_version:
          type: integer
          const: 2
        configuration:
          type: object
          description: >-
            Version-independent superset intent. Managed top-level collection
            items carry an _panel object with a stable id and enabled flag.
          additionalProperties: true
    CanonicalSnapshot:
      type: object
      required: [id, sequence, schema_version, document, document_json, sha256, created_at]
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
        parent_id:
          type: string
        schema_version:
          type: integer
          const: 2
        document:
          $ref: "#/components/schemas/CanonicalDocument"
        document_json:
          type: string
          description: Lossless JSON representation for clients that preserve large integers.
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
    CanonicalChange:
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [set, unset]
        path:
          type: string
        value_json:
          type: string
    CanonicalSave:
      type: object
      required: [revision, no_change]
      properties:
        revision:
          $ref: "#/components/schemas/CanonicalSnapshot"
        no_change:
          type: boolean
        task_id:
          type: string
    ConfigurationProfile:
      type: object
      required: [exact_version, os, arch, variant, feature_fingerprint]
      properties:
        exact_version:
          type: string
        os:
          type: string
        arch:
          type: string
        variant:
          type: string
        feature_fingerprint:
          $ref: "#/components/schemas/AnyObject"
    ConfigurationAdapterSupport:
      type: object
      required: [supported, profile]
      properties:
        supported:
          type: boolean
        profile:
          $ref: "#/components/schemas/ConfigurationProfile"
        adapter_id:
          type: string
        adapter_revision:
          type: string
        reason:
          type: string
        provenance:
          type: object
          properties:
            upstream_tag:
              type: string
            upstream_commit:
              type: string
            source:
              type: string
    ConfigurationDiagnostic:
      type: object
      required: [class, code, path, message]
      properties:
        class:
          type: string
          enum: [direct, mapped, ignored, blocking]
        code:
          type: string
        path:
          type: string
        message:
          type: string
    ConfigurationPreview:
      type: object
      required: [canonical_revision, core_artifact, support, config, diagnostics]
      properties:
        canonical_revision:
          $ref: "#/components/schemas/CanonicalSnapshot"
        core_artifact:
          $ref: "#/components/schemas/AnyObject"
        support:
          $ref: "#/components/schemas/ConfigurationAdapterSupport"
        config:
          $ref: "#/components/schemas/AnyObject"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationDiagnostic"
        ignored_digest:
          type: string
    ConfigurationCompile:
      type: object
      required: [support, artifact, task]
      properties:
        support:
          $ref: "#/components/schemas/ConfigurationAdapterSupport"
        artifact:
          $ref: "#/components/schemas/AnyObject"
        task:
          $ref: "#/components/schemas/AnyObject"
    SubscriptionUserInput:
      type: object
      additionalProperties: false
      required: [name, description, enabled]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    SubscriptionChannelInput:
      type: object
      additionalProperties: false
      required: [name, format, public_host, config, enabled]
      properties:
        name:
          type: string
        format:
          type: string
          enum: [sing-box, mihomo, loon]
        public_host:
          type: string
        config:
          $ref: "#/components/schemas/AnyObject"
        enabled:
          type: boolean
    SubscriptionSourceInput:
      type: object
      additionalProperties: false
      required: [name, source_kind, config, enabled]
      properties:
        name:
          type: string
        source_kind:
          type: string
          enum: [local, remote]
        config:
          $ref: "#/components/schemas/AnyObject"
        enabled:
          type: boolean
    SubscriptionTokenCreate:
      type: object
      additionalProperties: false
      required: [user_id, label]
      properties:
        user_id:
          type: string
        label:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
