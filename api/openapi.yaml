        required: true
        description: Opaque one-time-issued public subscription credential.
        schema: { type: string, minLength: 1, maxLength: 512 }
      - name: channelId
        in: path
        required: true
        description: Stable ID of a channel frozen into the applied activation bundle.
        schema: { type: string, minLength: 1, maxLength: 128 }
