        "200":
          description: Frozen client subscription bytes from the applied bundle.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            application/yaml:
              schema: { type: string }
            text/plain:
              schema: { type: string }
