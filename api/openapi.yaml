  /logs:
    get:
      operationId: listDurableLogs
      description: Lists sanitized durable event metadata newest first. It never returns full configuration, subscription content, or credentials.
      parameters:
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/LogSource" }
        - name: level
          in: query
          schema: { $ref: "#/components/schemas/LogLevel" }
        - name: code
          in: query
          schema: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: after_time
          in: query
          description: Exclusive newest-first cursor time; requires after_id.
          schema: { type: string, format: date-time }
        - name: after_id
          in: query
          description: Exclusive newest-first cursor ID; requires after_time.
          schema: { type: string }
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Sanitized durable log page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearDurableLogs
      description: Explicitly deletes sanitized durable logs matching the optional source and exclusive before cutoff.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/LogSource" }
        - name: before
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Number of deleted entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogClearResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /logs/stream:
    get:
      operationId: streamDurableLogs
      description: Streams sanitized durable log entries as SSE. Without since, an after cursor, or Last-Event-ID, the stream begins at connection time. Event IDs encode the durable time/id cursor for reconnects.
      parameters:
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/LogSource" }
        - name: level
          in: query
          schema: { $ref: "#/components/schemas/LogLevel" }
        - name: code
          in: query
          schema: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: after_time
          in: query
          description: Exclusive cursor time; requires after_id and cannot be combined with since.
          schema: { type: string, format: date-time }
        - name: after_id
          in: query
          description: Exclusive cursor ID; requires after_time and cannot be combined with since.
          schema: { type: string }
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A text/event-stream of log events with keepalive comments.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
