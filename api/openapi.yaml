          description: Uniform response for an unknown, expired, revoked, or unavailable token/channel selection.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: No bundle has been applied, or frozen publication is temporarily unavailable. The response never reflects the token.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
