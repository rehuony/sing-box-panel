openapi: 3.1.0
info:
  title: sing-box-panel API
  version: 0.1.0
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The panel HTTP process is ready to answer requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current browser or bearer session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A new browser session. The management token is never returned.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The current browser session was removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Machine-readable runtime and control-plane status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /dashboard/context:
    get:
      operationId: getDashboardContext
      responses:
        "200":
          description: Human-facing summary for the initial panel dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardContext"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /core/catalog/assets:
    get:
      operationId: listCoreCatalogAssets
      description: Lists exact-version Linux assets from the locally persisted official catalog. No network refresh is performed.
      parameters:
        - $ref: "#/components/parameters/ExactVersionQuery"
        - $ref: "#/components/parameters/CoreArchitectureQuery"
        - $ref: "#/components/parameters/CoreVariantQuery"
        - name: installable
          in: query
          description: When true, omit assets that lack one unambiguous trusted SHA-256 digest.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Matching catalog assets in stable newest-version and asset-ID order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogAssetList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409":
          description: The local catalog has not been initialized.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/catalog/refresh:
    post:
      operationId: refreshCoreCatalog
      description: Queues a maintenance task that refreshes the official core catalog.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The catalog refresh task was durably queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/artifacts:
    get:
      operationId: listCoreArtifacts
      parameters:
        - $ref: "#/components/parameters/ExactVersionQuery"
        - $ref: "#/components/parameters/CoreArchitectureQuery"
        - $ref: "#/components/parameters/CoreVariantQuery"
        - name: source_kind
          in: query
          schema: { $ref: "#/components/schemas/CoreArtifactSourceKind" }
        - name: verification_state
          in: query
          schema: { $ref: "#/components/schemas/CoreArtifactVerificationState" }
        - name: before_time
          in: query
          description: RFC 3339 keyset cursor time; must be paired with before_id.
          schema: { type: string, format: date-time }
        - name: before_id
          in: query
          description: Stable keyset cursor ID; must be paired with before_time.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Installed immutable core artifacts, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoreArtifactPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/CoreArtifactID"
    get:
      operationId: getCoreArtifact
      responses:
        "200":
          description: One installed immutable core artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoreArtifact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCoreArtifact
      description: Removes an unreferenced immutable core artifact. Referenced artifacts cannot be removed.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The core artifact was removed.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/artifacts/{artifactId}/quarantine:
    parameters:
      - $ref: "#/components/parameters/CoreArtifactID"
    post:
      operationId: quarantineCoreArtifact
      description: Monotonically quarantines immutable bytes. A currently running child is not stopped, but new checks, activations, starts, and rollbacks cannot use the artifact.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The artifact after applying the monotonic verification restriction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoreArtifact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/artifacts/{artifactId}/revoke:
    parameters:
      - $ref: "#/components/parameters/CoreArtifactID"
    post:
      operationId: revokeCoreArtifact
      description: Permanently revokes immutable bytes. A currently running child is not stopped, but no future check, activation, start, or rollback may use the artifact; reinstalling identical bytes cannot restore trust.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The terminally revoked artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoreArtifact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/install:
    post:
      operationId: installCoreCatalogAsset
      description: Queues verified installation of one exact catalog asset.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoreInstallRequest" }
      responses:
        "202":
          description: The core installation task was durably queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/import:
    post:
      operationId: importCoreArchive
      description: Queues verified import of a local archive identified by absolute path and trusted SHA-256 metadata.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoreImportRequest" }
      responses:
        "202":
          description: The core import task was durably queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/capability:
    get:
      operationId: getCoreCapability
      description: Resolves capability support for an explicit exact version. When core_version is omitted, the application verifies and uses the actual running core version; it never substitutes the latest catalog version.
      parameters:
        - name: core_version
          in: query
          description: Optional non-zero exact stable semantic version. Omit to inspect the verified running core.
          schema: { $ref: "#/components/schemas/ExactCoreVersion" }
      responses:
        "200":
          description: Capability support and the exact version-resolution source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoreCapabilityStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409":
          description: core_version was omitted and no verified core is running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/capability/generations:
    get:
      operationId: listCapabilityGenerations
      description: Lists complete, locally validated capability generations. Listing candidates never changes an active pin.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Locally available immutable generations, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityGenerationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/capability/refresh:
    post:
      operationId: refreshCapabilityGeneration
      description: Validates and atomically saves one complete, commit-bound local generation as candidates. It never changes an active pin.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityGenerationInput" }
      responses:
        "200":
          description: The saved generation and its candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityGenerationRefresh" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/capability/inspect:
    get:
      operationId: inspectCapabilityCandidate
      description: Reads one exact immutable candidate, including its declarative manifest, without changing the active pin.
      parameters:
        - name: core_version
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ExactCoreVersion" }
        - name: commit
          in: query
          required: true
          schema: { $ref: "#/components/schemas/GitObjectID" }
        - name: manifest_sha256
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SHA256" }
      responses:
        "200":
          description: The exact locally stored candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityManifestCandidate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/capability/upgrade:
    post:
      operationId: upgradeCapabilityCandidate
      description: Previews an immutable candidate when accept is false; pins that exact candidate only when accept is explicitly true.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityUpgradeRequest" }
      responses:
        "200":
          description: A preview, or the accepted pin together with the preview.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CapabilityUpgradePreview"
                  - $ref: "#/components/schemas/CapabilityUpgrade"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/capabilities/{manifestSha256}/quarantine:
    post:
      operationId: quarantineCapabilityManifest
      description: Permanently quarantines one immutable capability manifest digest. The first reason and timestamp are retained; repeating that reason is idempotent and a different reason conflicts. No unquarantine operation is exposed.
      parameters:
        - name: manifestSha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SHA256" }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityQuarantineRequest" }
      responses:
        "200":
          description: The original permanent quarantine record, including for an idempotent retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityQuarantine" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/status:
    get:
      operationId: getCoreRuntimeStatus
      responses:
        "200":
          description: Desired, applied, rollback, and independently verified live runtime identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /core/check:
    post:
      operationId: checkStartupArtifact
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartupCheckRequest" }
      responses:
        "202":
          description: Exact binary and startup-byte check durably queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/activate:
    post:
      operationId: activateStartupArtifact
      description: Freezes an activation bundle and queues the same runtime apply service used by config apply.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "202":
          description: Immutable activation inputs and the durable runtime task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationQueued" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/start:
    post:
      operationId: startCoreRuntime
      description: Queues a start using exactly the last successfully applied bundle.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable runtime start task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/stop:
    post:
      operationId: stopCoreRuntime
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable runtime stop task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/restart:
    post:
      operationId: restartCoreRuntime
      description: Queues a restart using exactly the last successfully applied bundle.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable runtime restart task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /core/rollback:
    post:
      operationId: rollbackCoreRuntime
      description: Queues the frozen rollback bundle without re-rendering any input.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable rollback task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /config/apply:
    post:
      operationId: applyStartupArtifact
      description: Alias of core activate backed by the identical application service.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "202":
          description: Immutable activation inputs and the durable runtime task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationQueued" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /config/render:
    post:
      operationId: renderStructuredConfiguration
      description: Projects the current canonical head through one exact pinned declarative capability, persists immutable startup bytes, and queues their exact-binary check. When core_version is omitted, the verified running exact version and artifact are used; latest is never substituted.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StructuredRenderRequest" }
      responses:
        "202":
          description: The pending immutable structured candidate and its durable startup-check task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StructuredRender" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /config/artifacts:
    get:
      operationId: listStartupArtifacts
      description: Lists durable structured and manual startup candidates without exposing their potentially secret configuration bytes.
      parameters:
        - name: canonical_revision_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: core_version
          in: query
          schema: { $ref: "#/components/schemas/ExactCoreVersion" }
        - name: core_artifact_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: kind
          in: query
          schema: { type: string, enum: [structured, manual] }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ManualArtifactState" }
        - name: before_time
          in: query
          description: RFC 3339 cursor time; must be paired with before_id.
          schema: { type: string, format: date-time }
        - name: before_id
          in: query
          description: Stable cursor ID; must be paired with before_time.
