# SPDX-License-Identifier: GPL-3.0-or-later

name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

env:
  RELEASE_KEYPAIR_DIR: .github/keypair

concurrency:
  group: signed-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release-version: ${{ steps.identity.outputs.release-version }}
      source-sha: ${{ steps.identity.outputs.source-sha }}

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${SELECTED_REF}" != "${expected_ref}" ]]; then
            printf 'signed releases must run from %s, got %s\n' "${expected_ref}" "${SELECTED_REF}" >&2
            exit 1
          fi

      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Freeze source and validate stable version
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release version must be stable vMAJOR.MINOR.PATCH without leading zeroes\n' >&2
            exit 1
          fi
          go tool sign-release validate-version --version "${RELEASE_VERSION}"
          if [[ "$(git rev-parse --verify 'HEAD^{commit}')" != "${SOURCE_SHA}" ]]; then
            printf 'checkout does not match the frozen workflow source SHA\n' >&2
            exit 1
          fi
          printf 'release-version=%s\n' "${RELEASE_VERSION}" >>"${GITHUB_OUTPUT}"
          printf 'source-sha=%s\n' "${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Require successful CI for the frozen source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(
            gh api \
              --method GET \
              -f branch="${DEFAULT_BRANCH}" \
              -f event=push \
              -f head_sha="${SOURCE_SHA}" \
              -f per_page=100 \
              "repos/${REPOSITORY}/actions/workflows/ci-checks.yml/runs"
          )"
          latest="$(
            jq -c \
              --arg branch "${DEFAULT_BRANCH}" \
              --arg sha "${SOURCE_SHA}" \
              '[.workflow_runs[] | select(.event == "push" and .head_branch == $branch and .head_sha == $sha)] | sort_by(.id) | last' \
              <<<"${runs}"
          )"
          if [[ "${latest}" == "null" ]]; then
            printf 'no CI push run exists for %s on %s\n' "${SOURCE_SHA}" "${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          if ! jq -e '.status == "completed" and .conclusion == "success"' <<<"${latest}" >/dev/null; then
            printf 'the latest CI push run for %s is not successful: %s\n' \
              "${SOURCE_SHA}" "$(jq -c '{id, status, conclusion, html_url}' <<<"${latest}")" >&2
            exit 1
          fi
          printf 'using successful CI run %s\n' "$(jq -r '.html_url' <<<"${latest}")"

      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/github-response"
          require_absent() {
            local endpoint="$1"
            local description="$2"
            local request_status

            set +e
            gh api --include "${endpoint}" >"${response_file}" 2>&1
            request_status=$?
            set -e
            if [[ ${request_status} -eq 0 ]]; then
              printf '%s already exists for %s\n' "${description}" "${RELEASE_VERSION}" >&2
              return 1
            fi
            if grep -Eq '^HTTP/[^ ]+ 404([ .]|$)' "${response_file}"; then
              return 0
            fi
            printf 'could not determine whether %s exists\n' "${description}" >&2
            cat "${response_file}" >&2
            return "${request_status}"
          }
          require_absent "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" "tag"
          require_absent "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}" "release"

  core-contract:
    needs: guard
    uses: ./.github/workflows/core-compatibility.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ needs.guard.outputs.source-sha }}

  build-sign:
    name: Build and sign Linux release
    needs:
      - guard
      - core-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read

    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate repository update key
        run: |
          set -euo pipefail
          key_path="${RELEASE_KEYPAIR_DIR}/release-signing-public-key"
          if [[ ! -f "${key_path}" || -L "${key_path}" ]]; then
            printf '%s must be a regular, non-symbolic file\n' "${key_path}" >&2
            exit 1
          fi
          key_size="$(wc -c <"${key_path}" | tr -d '[:space:]')"
          key="$(<"${key_path}")"
          if [[ ! "${key}" =~ ^[A-Za-z0-9+/]{43}=$ ]] ||
            [[ "${key_size}" != 44 && "${key_size}" != 45 ]]; then
            printf '%s must contain one standard-Base64 Ed25519 public key\n' "${key_path}" >&2
            exit 1
          fi

      - name: Build formal release
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
        run: |
          set -euo pipefail
          make release \
            VERSION="${RELEASE_VERSION}" \
            OUT="${RUNNER_TEMP}/sing-box-panel-release"

      - name: Sign checksum manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_SIGNING_PRIVATE_KEY}" ]]; then
            printf 'release environment secret RELEASE_SIGNING_PRIVATE_KEY is required\n' >&2
            exit 1
          fi
          private_key="${RUNNER_TEMP}/release-signing-private-key.pem"
          cleanup_private_key() {
            rm -f -- "${private_key}"
          }
          trap cleanup_private_key EXIT
          umask 077
          printf '%s' "${RELEASE_SIGNING_PRIVATE_KEY}" >"${private_key}"
          go tool sign-release sign \
            --private-key "${private_key}" \
            --public-key "${RELEASE_KEYPAIR_DIR}/release-signing-public-key" \
            --version "${RELEASE_VERSION}" \
            --checksums "${RUNNER_TEMP}/sing-box-panel-release/SHA256SUMS" \
            --signature "${RUNNER_TEMP}/sing-box-panel-release/SHA256SUMS.sig"

      - name: Verify signed artifact set
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/sing-box-panel-release"
          go tool sign-release verify \
            --public-key "${RELEASE_KEYPAIR_DIR}/release-signing-public-key" \
            --version "${RELEASE_VERSION}" \
            --checksums "${release_dir}/SHA256SUMS" \
            --signature "${release_dir}/SHA256SUMS.sig"
          (
            cd -- "${release_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          mapfile -t assets < <(find "${release_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          expected=(SHA256SUMS SHA256SUMS.sig sing-box-panel-linux-amd64 sing-box-panel-linux-arm64)
          if [[ "${assets[*]}" != "${expected[*]}" ]]; then
            printf 'formal release did not produce the exact four-asset set\n' >&2
            exit 1
          fi

      - name: Retain signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ needs.guard.outputs.release-version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sing-box-panel-release/SHA256SUMS
            ${{ runner.temp }}/sing-box-panel-release/SHA256SUMS.sig
            ${{ runner.temp }}/sing-box-panel-release/sing-box-panel-linux-amd64
            ${{ runner.temp }}/sing-box-panel-release/sing-box-panel-linux-arm64
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke:
    name: Smoke Linux ${{ matrix.architecture }}
    needs:
      - guard
      - build-sign
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.guard.outputs.release-version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sing-box-panel-release

      - name: Run native release smoke test
        env:
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
        run: |
          set -euo pipefail
          scripts/test/smoke-release.sh \
            --release-dir "${RUNNER_TEMP}/sing-box-panel-release" \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_SHA}" \
            --architecture "${RELEASE_ARCHITECTURE}" \
            --public-key "${RELEASE_KEYPAIR_DIR}/release-signing-public-key"

  draft:
    name: Create verified Draft Release
    needs:
      - guard
      - build-sign
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.guard.outputs.release-version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sing-box-panel-release

      - name: Recheck tag and release absence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/github-response"
          require_absent() {
            local endpoint="$1"
            local description="$2"
            local request_status

            set +e
            gh api --include "${endpoint}" >"${response_file}" 2>&1
            request_status=$?
            set -e
            if [[ ${request_status} -eq 0 ]]; then
              printf '%s appeared while the release was being verified\n' "${description}" >&2
              return 1
            fi
            if grep -Eq '^HTTP/[^ ]+ 404([ .]|$)' "${response_file}"; then
              return 0
            fi
            printf 'could not determine whether %s exists\n' "${description}" >&2
            cat "${response_file}" >&2
            return "${request_status}"
          }
          require_absent "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" "tag"
          require_absent "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}" "release"

      - name: Create empty Draft Release
        id: create-draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
        run: |
          set -euo pipefail
          marker="<!-- sing-box-panel-release-run:${RUN_ID}:${RUN_ATTEMPT}:${SOURCE_SHA} -->"
          draft_url="$(
            gh release create "${RELEASE_VERSION}" \
              --repo "${REPOSITORY}" \
              --draft \
              --generate-notes \
              --notes "${marker}" \
              --target "${SOURCE_SHA}" \
              --title "sing-box-panel ${RELEASE_VERSION}"
          )"
          printf 'created=true\n' >>"${GITHUB_OUTPUT}"
          release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          jq -e \
            --arg marker "${marker}" \
            --arg sha "${SOURCE_SHA}" \
            --arg tag "${RELEASE_VERSION}" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha and ((.body // "") | contains($marker)) and (.assets | length == 0)' \
            <<<"${release_json}" >/dev/null
          printf 'draft-url=%s\n' "${draft_url}" >>"${GITHUB_OUTPUT}"

      - name: Upload exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/sing-box-panel-release"
          gh release upload "${RELEASE_VERSION}" \
            --repo "${REPOSITORY}" \
            "${release_dir}/SHA256SUMS" \
            "${release_dir}/SHA256SUMS.sig" \
            "${release_dir}/sing-box-panel-linux-amd64" \
            "${release_dir}/sing-box-panel-linux-arm64"

      - name: Download and verify Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
        run: |
          set -euo pipefail
          local_dir="${RUNNER_TEMP}/sing-box-panel-release"
          downloaded_dir="${RUNNER_TEMP}/draft-download"
          mkdir -- "${downloaded_dir}"

          marker="<!-- sing-box-panel-release-run:${RUN_ID}:${RUN_ATTEMPT}:${SOURCE_SHA} -->"
          release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          tag_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}")"
          expected_names='["SHA256SUMS","SHA256SUMS.sig","sing-box-panel-linux-amd64","sing-box-panel-linux-arm64"]'
          jq -e \
            --arg marker "${marker}" \
            --arg sha "${SOURCE_SHA}" \
            --arg tag "${RELEASE_VERSION}" \
            --argjson names "${expected_names}" \
            '.draft == true and .prerelease == false and .tag_name == $tag and .target_commitish == $sha and ((.body // "") | contains($marker)) and ([.assets[].name] | sort) == $names and ([.assets[].name] | unique | length) == 4' \
            <<<"${release_json}" >/dev/null
          jq -e --arg sha "${SOURCE_SHA}" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<<"${tag_json}" >/dev/null
          while IFS=$'\t' read -r asset_name remote_size; do
            local_size="$(wc -c <"${local_dir}/${asset_name}" | tr -d '[:space:]')"
            if [[ "${local_size}" != "${remote_size}" ]]; then
              printf 'Draft asset size mismatch for %s\n' "${asset_name}" >&2
              exit 1
            fi
          done < <(jq -r '.assets[] | [.name, .size] | @tsv' <<<"${release_json}")

          gh release download "${RELEASE_VERSION}" \
            --repo "${REPOSITORY}" \
            --dir "${downloaded_dir}"
          mapfile -t downloaded_names < <(find "${downloaded_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          expected=(SHA256SUMS SHA256SUMS.sig sing-box-panel-linux-amd64 sing-box-panel-linux-arm64)
          if [[ "${downloaded_names[*]}" != "${expected[*]}" ]]; then
            printf 'downloaded Draft does not contain the exact four-asset set\n' >&2
            exit 1
          fi
          for asset_name in "${expected[@]}"; do
            cmp "${local_dir}/${asset_name}" "${downloaded_dir}/${asset_name}"
          done

          go tool sign-release verify \
            --public-key "${RELEASE_KEYPAIR_DIR}/release-signing-public-key" \
            --version "${RELEASE_VERSION}" \
            --checksums "${downloaded_dir}/SHA256SUMS" \
            --signature "${downloaded_dir}/SHA256SUMS.sig"
          (
            cd -- "${downloaded_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          chmod 0755 \
            "${downloaded_dir}/sing-box-panel-linux-amd64" \
            "${downloaded_dir}/sing-box-panel-linux-arm64"
          runtime_metadata="$("${downloaded_dir}/sing-box-panel-linux-amd64" --output json version)"
          source_date="$(git show -s --format=%cI "${SOURCE_SHA}")"
          jq -e \
            --arg commit "${SOURCE_SHA}" \
            --arg date "${source_date}" \
            --arg version "${RELEASE_VERSION}" \
            '.commit == $commit and .date == $date and .version == $version' \
            <<<"${runtime_metadata}" >/dev/null
          public_key="$(tr -d '\n' <"${RELEASE_KEYPAIR_DIR}/release-signing-public-key")"
          for architecture in amd64 arm64; do
            binary="${downloaded_dir}/sing-box-panel-linux-${architecture}"
            go version -m "${binary}" | grep -Fqx $'\tbuild\tGOARCH='"${architecture}"
            LC_ALL=C grep -aFq -- "${public_key}" "${binary}"
          done

      - name: Record Draft Release
        env:
          DRAFT_URL: ${{ steps.create-draft.outputs.draft-url }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
        run: |
          {
            printf '## Verified Draft Release\n\n'
            printf -- '- Version: %s\n' "${RELEASE_VERSION}"
            printf -- '- Source: %s\n' "${SOURCE_SHA}"
            printf -- '- Draft: %s\n' "${DRAFT_URL}"
            printf '\nPublish remains an explicit human action.\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove only this unsuccessful workflow's Draft
        if: ${{ (failure() || cancelled()) && steps.create-draft.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.release-version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
        run: |
          set -euo pipefail
          marker="<!-- sing-box-panel-release-run:${RUN_ID}:${RUN_ATTEMPT}:${SOURCE_SHA} -->"
          release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          tag_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}")"
          if ! jq -e \
            --arg marker "${marker}" \
            --arg sha "${SOURCE_SHA}" \
            --arg tag "${RELEASE_VERSION}" \
            '.draft == true and .tag_name == $tag and .target_commitish == $sha and ((.body // "") | contains($marker))' \
            <<<"${release_json}" >/dev/null; then
            printf 'refusing to clean up a Draft not owned by this workflow run\n' >&2
            exit 1
          fi
          if ! jq -e --arg sha "${SOURCE_SHA}" '.object.type == "commit" and .object.sha == $sha' <<<"${tag_json}" >/dev/null; then
            printf 'refusing to clean up a tag that does not point to the frozen source\n' >&2
            exit 1
          fi

          release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          jq -e \
            --arg marker "${marker}" \
            --arg sha "${SOURCE_SHA}" \
            '.draft == true and .target_commitish == $sha and ((.body // "") | contains($marker))' \
            <<<"${release_json}" >/dev/null
          release_id="$(jq -er '.id' <<<"${release_json}")"
          gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"

          tag_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_VERSION}")"
          jq -e --arg sha "${SOURCE_SHA}" '.object.type == "commit" and .object.sha == $sha' <<<"${tag_json}" >/dev/null
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${RELEASE_VERSION}"
