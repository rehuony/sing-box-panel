name: Build Release

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Go, web, and Linux builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pinned pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts --verify-store-integrity

      - name: Verify third-party notices
        run: go run ./cmd/third-party-notices --check

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_scripts < <(find scripts -type f -name '*.sh' -print0)
          bash -n "${shell_scripts[@]}"

      - name: Validate OpenAPI contract
        run: go run ./cmd/verify-openapi api/openapi.yaml

      - name: Check Go formatting and module tidiness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_files < <(find cmd internal release web -type f -name '*.go' -print0)
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "${unformatted}" >&2
            gofmt -d "${go_files[@]}"
            exit 1
          fi
          go mod tidy -diff

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Smoke-test deterministic fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/coreartifact -run '^$' -fuzz '^FuzzParseExactVersionCanonicalRoundTrip$' -fuzztime=5s
          go test ./internal/subscription -run '^$' -fuzz '^FuzzRenderIsPureAndDeterministic$' -fuzztime=5s

      - name: Test Go packages with race detector
        run: go test -race ./...

      - name: Type-check web application
        working-directory: web
        run: pnpm run typecheck

      - name: Test web application
        working-directory: web
        run: pnpm test

      - name: Build web application
        working-directory: web
        run: pnpm run build

      - name: Build web-enabled host binary
        run: go build -tags webdist -trimpath -o "${RUNNER_TEMP}/sing-box-panel" ./cmd/sing-box-panel

      - name: Verify Linux release builds
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DATE: unknown
        run: ./scripts/verify-release-build.sh "${RUNNER_TEMP}/release"

      - name: Inspect ephemeral release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -x "${RUNNER_TEMP}/release/sing-box-panel-linux-amd64"
          test -x "${RUNNER_TEMP}/release/sing-box-panel-linux-arm64"
          (
            cd "${RUNNER_TEMP}/release"
            sha256sum --check SHA256SUMS
          )
