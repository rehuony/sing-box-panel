<!doctype html>
<html lang="en">
  <head>
    <meta name="sing-box-panel-style-nonce" content="__SBP_STYLE_NONCE__" />
    <base href="/" data-sbp-runtime />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="sing-box-panel-base-path" content="__SBP_BASE_PATH__" />
    <meta name="sing-box-panel-appearance" content="__SBP_APPEARANCE__" />
    <meta name="description" content="Sing-Box Panel operations console" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Sing-Box Panel</title>
    <style nonce="__SBP_STYLE_NONCE__" id="initial-appearance">
      :root:not([data-resolved-theme]) {
        color-scheme: light dark;
        --initial-color: #6d4ed1;
        --color-canvas: light-dark(
          color-mix(in srgb, var(--initial-color), #ffffff 96%),
          color-mix(in srgb, var(--initial-color), #18171e 98%)
        );
        background: var(--color-canvas);
      }
      :root:not([data-resolved-theme]) body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-canvas);
      }
      /*__SBP_APPEARANCE_CSS__*/
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
