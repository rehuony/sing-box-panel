<!doctype html>
<html lang="en">
  <head>
    <meta name="sing-box-panel-style-nonce" content="__SBP_STYLE_NONCE__" />
    <base href="/" data-sbp-runtime />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="sing-box-panel-base-path" content="__SBP_BASE_PATH__" />
    <meta name="sing-box-panel-appearance" content="__SBP_APPEARANCE__" />
    <meta name="description" content="Sing-Box Panel operations console" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Sing-Box Panel</title>
    <style nonce="__SBP_STYLE_NONCE__" id="initial-appearance">
      :root:not([data-resolved-theme]) {
        color-scheme: light dark;
        --initial-color: #6d4ed1;
        --initial-surface: light-dark(#ffffff, #18171e);
        --color-paper: color-mix(in srgb, var(--initial-color), var(--initial-surface) 98%);
        --color-paper-2: color-mix(in srgb, var(--initial-color), var(--initial-surface) 96%);
        --color-paper-3: color-mix(in srgb, var(--initial-color), var(--initial-surface) 92%);
        --color-accent-soft: light-dark(
          color-mix(in srgb, var(--initial-color), #ffffff 91%),
          color-mix(in srgb, var(--initial-color), #18171e 84%)
        );
        --color-canvas: light-dark(var(--color-paper-2), var(--color-paper));
        --color-canvas-deep: light-dark(var(--color-paper-3), oklch(13% 0.014 274));
        background: var(--color-canvas);
      }
      :root:not([data-resolved-theme]) body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 0% 0%, var(--color-accent-soft), transparent 55%),
          linear-gradient(145deg, var(--color-paper), var(--color-canvas) 50%, var(--color-canvas-deep));
        background-attachment: fixed;
      }
      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        :root:not([data-resolved-theme]) body {
          background: var(--color-canvas);
        }
      }
      /*__SBP_APPEARANCE_CSS__*/
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
